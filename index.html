<title>Rifts Field Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: field-terminal HUD. Command bar with campaign + party roster → workspace tabs on the left, shared comms log docked right (stacks on phones).
   Look: a deliberate single dark theme. Gunmetal panels with HUD corner brackets, ley-line blue as the live accent,
   Rift violet for magic/psionics, hazard amber for Mega-Damage, steel blue for S.D.C. */
:root{
  --bg:#070a0e; --panel:#0e141a; --sunk:#131b23; --ink:#d9e6ee; --muted:#7d91a0; --line:#22313d;
  --accent:#4cc9ff; --accent-soft:rgba(76,201,255,.12); --on-accent:#04121b;
  --rift:#b07bff; --rift-soft:rgba(176,123,255,.14);
  --md:#ffb23e; --md-soft:rgba(255,178,62,.13); --sdc:#7fb3d9; --sdc-soft:rgba(127,179,217,.13);
  --good:#46e3a2; --bad:#ff5b4f; --bad-soft:rgba(255,91,79,.13);
  --glow:0 0 0 1px rgba(76,201,255,.35),0 0 18px rgba(76,201,255,.18);
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:2px; --cut:10px;
  --field:#0a1117; --plate:#16212b; --plate2:#121b23; --plate-h:#1a2a36; --edge:#2a3a47; --edge2:#22313d; --edge3:#2c3e4c; --edge4:#1a2630; --ph:#4f6271; --bright:#ffffff;
  --pri-a:#5fd3ff; --pri-b:#2aa6e0; --pri-ha:#86e0ff; --pri-hb:#38b6f0; --pri-edge:#7fdcff; --on-md:#1a1004; --on-sdc:#06121c; --on-good:#04140d;
  --gridl:rgba(76,201,255,.035); --haze1:rgba(176,123,255,.16); --haze2:rgba(76,201,255,.10); --scan:1;
  --acc-rgb:76,201,255; --rift-rgb:176,123,255; --md-rgb:255,178,62; --bad-rgb:255,91,79; --sdc-rgb:127,179,217; --good-rgb:70,227,162; --sheen:rgba(255,255,255,.025); --scanl:rgba(255,255,255,.018);
  color-scheme:dark;
}
/* Daylight: chosen in the header, or Auto when the device/viewer is set to light */
:root[data-skin="day"]{
  --bg:#e6ecf0; --panel:#f7f9fa; --sunk:#eef2f5; --ink:#0c1820; --muted:#4c6170; --line:#c2cfd8;
  --accent:#0477ad; --accent-soft:rgba(4,119,173,.10); --on-accent:#ffffff;
  --rift:#7036cf; --rift-soft:rgba(112,54,207,.10);
  --md:#a95f00; --md-soft:rgba(169,95,0,.10); --sdc:#2a6896; --sdc-soft:rgba(42,104,150,.10);
  --good:#0f8556; --bad:#c42f25; --bad-soft:rgba(196,47,37,.09);
  --glow:0 0 0 1px rgba(4,119,173,.35),0 0 14px rgba(4,119,173,.12);
  --field:#ffffff; --plate:#e4ebf0; --plate2:#edf2f5; --plate-h:#d9e4eb; --edge:#bccbd5; --edge2:#cbd7df; --edge3:#b3c3ce; --edge4:#dde5eb; --ph:#8798a4; --bright:#0c1820;
  --pri-a:#1593cc; --pri-b:#0477ad; --pri-ha:#27a4dc; --pri-hb:#0a86c0; --pri-edge:#0477ad; --on-md:#ffffff; --on-sdc:#ffffff; --on-good:#ffffff;
  --gridl:rgba(4,119,173,.05); --haze1:rgba(112,54,207,.08); --haze2:rgba(4,119,173,.07); --scan:0;
  --acc-rgb:4,119,173; --rift-rgb:112,54,207; --md-rgb:169,95,0; --bad-rgb:196,47,37; --sdc-rgb:42,104,150; --good-rgb:15,133,86; --sheen:rgba(255,255,255,.6); --scanl:transparent;
  color-scheme:light;
}
@media (prefers-color-scheme: light){:root[data-skin="auto"]:not([data-theme="dark"]){
  --bg:#e6ecf0; --panel:#f7f9fa; --sunk:#eef2f5; --ink:#0c1820; --muted:#4c6170; --line:#c2cfd8;
  --accent:#0477ad; --accent-soft:rgba(4,119,173,.10); --on-accent:#ffffff;
  --rift:#7036cf; --rift-soft:rgba(112,54,207,.10);
  --md:#a95f00; --md-soft:rgba(169,95,0,.10); --sdc:#2a6896; --sdc-soft:rgba(42,104,150,.10);
  --good:#0f8556; --bad:#c42f25; --bad-soft:rgba(196,47,37,.09);
  --glow:0 0 0 1px rgba(4,119,173,.35),0 0 14px rgba(4,119,173,.12);
  --field:#ffffff; --plate:#e4ebf0; --plate2:#edf2f5; --plate-h:#d9e4eb; --edge:#bccbd5; --edge2:#cbd7df; --edge3:#b3c3ce; --edge4:#dde5eb; --ph:#8798a4; --bright:#0c1820;
  --pri-a:#1593cc; --pri-b:#0477ad; --pri-ha:#27a4dc; --pri-hb:#0a86c0; --pri-edge:#0477ad; --on-md:#ffffff; --on-sdc:#ffffff; --on-good:#ffffff;
  --gridl:rgba(4,119,173,.05); --haze1:rgba(112,54,207,.08); --haze2:rgba(4,119,173,.07); --scan:0;
  --acc-rgb:4,119,173; --rift-rgb:112,54,207; --md-rgb:169,95,0; --bad-rgb:196,47,37; --sdc-rgb:42,104,150; --good-rgb:15,133,86; --sheen:rgba(255,255,255,.6); --scanl:transparent;
  color-scheme:light;
}}
:root[data-skin="auto"][data-theme="light"]{
  --bg:#e6ecf0; --panel:#f7f9fa; --sunk:#eef2f5; --ink:#0c1820; --muted:#4c6170; --line:#c2cfd8;
  --accent:#0477ad; --accent-soft:rgba(4,119,173,.10); --on-accent:#ffffff;
  --rift:#7036cf; --rift-soft:rgba(112,54,207,.10);
  --md:#a95f00; --md-soft:rgba(169,95,0,.10); --sdc:#2a6896; --sdc-soft:rgba(42,104,150,.10);
  --good:#0f8556; --bad:#c42f25; --bad-soft:rgba(196,47,37,.09);
  --glow:0 0 0 1px rgba(4,119,173,.35),0 0 14px rgba(4,119,173,.12);
  --field:#ffffff; --plate:#e4ebf0; --plate2:#edf2f5; --plate-h:#d9e4eb; --edge:#bccbd5; --edge2:#cbd7df; --edge3:#b3c3ce; --edge4:#dde5eb; --ph:#8798a4; --bright:#0c1820;
  --pri-a:#1593cc; --pri-b:#0477ad; --pri-ha:#27a4dc; --pri-hb:#0a86c0; --pri-edge:#0477ad; --on-md:#ffffff; --on-sdc:#ffffff; --on-good:#ffffff;
  --gridl:rgba(4,119,173,.05); --haze1:rgba(112,54,207,.08); --haze2:rgba(4,119,173,.07); --scan:0;
  --acc-rgb:4,119,173; --rift-rgb:112,54,207; --md-rgb:169,95,0; --bad-rgb:196,47,37; --sdc-rgb:42,104,150; --good-rgb:15,133,86; --sheen:rgba(255,255,255,.6); --scanl:transparent;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
h1,h2,h3,.lab,.btn,.tab,.chip{font-family:var(--f-display)}
h1{font-size:26px;font-weight:700;letter-spacing:.02em;margin:0;line-height:1}
h2{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--muted)}
h3{font-size:15px;font-weight:600;margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.bar .sub{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.roster{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip .lv{font-family:var(--f-mono);font-size:11px;opacity:.8}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r);padding:5px 11px;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:2px 8px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:16px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 14px;font-size:17px;font-weight:600;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.lab{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:70px}
input:read-only{opacity:.7}
.ident{display:grid;grid-template-columns:1.8fr 1.3fr 1.1fr 1.7fr .6fr;gap:10px}
@media (max-width:640px){.ident{grid-template-columns:1fr 1fr}}
.attrs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
@media (max-width:640px){.attrs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.attr{border:1px solid var(--line);border-radius:var(--r);padding:6px;text-align:center;background:var(--sunk);display:flex;flex-direction:column;gap:3px}
.attr .lab{color:var(--ink)}
.attr input{text-align:center;font-size:20px;font-weight:600;padding:2px;background:var(--panel)}
.attr .eff{font-size:11px;color:var(--muted);min-height:2.6em;line-height:1.3}
.attr .eff b{color:var(--accent);font-weight:600}
.pools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pool{border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.pool .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pool .val{font-family:var(--f-mono);font-size:18px;font-weight:600}
.pool .val small{font-size:12px;color:var(--muted);font-weight:400}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.pool.md .meter i{background:var(--md)}
.pool.sdc .meter i{background:var(--sdc)}
.pool.hp .meter i{background:var(--bad)}
.pool .ctl{display:flex;gap:4px}
.pool .ctl input{width:60px;flex:none}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.tag.md{background:var(--md-soft);color:var(--md)}
.tag.sdc{background:var(--sdc-soft);color:var(--sdc)}
.combat{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.cstat{border:1px solid var(--line);border-radius:var(--r);padding:7px 8px;display:flex;flex-direction:column;gap:4px;background:var(--sunk)}
.cstat .t{display:flex;justify-content:space-between;align-items:baseline}
.cstat .tot{font-family:var(--f-mono);font-size:20px;font-weight:600}
.cstat .parts{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.cstat .parts input{width:46px;padding:1px 4px;font-size:12px}
.cstat .btn{align-self:stretch}
.pips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pip{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);background:transparent;cursor:pointer;padding:0}
.pip.used{background:var(--accent)}
table{border-collapse:collapse;width:100%}
.tbl{overflow-x:auto}
th{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{padding:3px 5px}
td.n{width:64px}
td.pct{font-family:var(--f-mono);font-weight:600;font-size:15px;width:56px;text-align:right}
.saves{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.save{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--sunk)}
.save .nm{font-size:13px}
.save .tgt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.gear-card{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.gear-card.equipped{border-color:var(--md);box-shadow:inset 3px 0 0 var(--md)}
.gear-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px}
.dmgbox{border:2px solid var(--ink);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.dmgbox .row input{width:90px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);padding:5px 10px;font-family:var(--f-mono);font-weight:600;font-size:12px;cursor:pointer}
.seg button[aria-pressed="true"].md{background:var(--md);color:var(--panel)}
.seg button[aria-pressed="true"].sdc{background:var(--sdc);color:var(--panel)}
.result{font-size:13px;border-left:3px solid var(--accent);padding:4px 10px;background:var(--accent-soft)}
/* dice dock */
.dock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:12px}
.dice-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dice-btns .btn{font-family:var(--f-mono);font-size:13px;padding:6px 2px}
.expr{display:flex;gap:6px}
.log{display:flex;flex-direction:column;gap:6px;max-height:min(62vh,640px);overflow-y:auto;padding-right:2px}
.entry{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.entry .who{font-size:11px;color:var(--muted);grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.entry .what{font-weight:500;min-width:0;overflow-wrap:anywhere}
.entry .tot{font-family:var(--f-mono);font-size:22px;font-weight:600;grid-row:2/4;grid-column:2;align-self:center}
.entry .det{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.entry.crit{border-color:var(--accent);background:var(--accent-soft)}
.entry.fail .tot{color:var(--bad)}
.entry.ok .tot{color:var(--good)}
.flag{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.flag.crit{color:var(--accent)} .flag.fail{color:var(--bad)} .flag.ok{color:var(--good)}
.notice{font-size:12px;border:1px dashed var(--line);border-radius:var(--r);padding:8px 10px;color:var(--muted)}
.empty{text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{color:var(--ink);font-size:22px}
.empty p{max-width:52ch;margin:0;color:var(--muted)}
.ref{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.ref b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lib-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:6px}
.lib-card p{margin:0;font-size:13px}
.lib-card .btn{align-self:flex-start;margin-top:auto}
.lib-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lib-top h3{font-size:17px;line-height:1.15;text-wrap:balance}
.lib-pct{font-family:var(--f-mono);font-weight:600;font-size:15px;white-space:nowrap;text-align:right}
.lib-pct small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.lib-ex{color:var(--muted)}
.lib-ex .lab{color:var(--accent);margin-right:4px}
.pen{color:var(--bad);font-weight:600}
.attr .eff b.pen{color:var(--bad)}
.class-line{margin:10px 0 0;font-size:13px;color:var(--muted)}
.class-line b{color:var(--ink);font-weight:600}
tr.grp td{font-family:var(--f-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);padding-top:12px;border-bottom:2px solid var(--line)}
.src-sel{font-size:12px;padding:3px 4px}
.sk-info{font-size:12px;margin-top:3px}
.sk-info summary{cursor:pointer;color:var(--muted)}
.sk-info p{margin:4px 0 0;max-width:60ch}
.sk-info .lab{color:var(--accent)}
/* starters & how-to */
.starter-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.starter-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.starter{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.starter p{margin:0;font-size:13px}
.starter .btn{margin-top:auto;align-self:flex-start}
.starter.blank{border-style:dashed;background:transparent}
.st-top h3{font-size:22px;line-height:1.1}
.role{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:3px;margin-bottom:4px}
.st-list{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.st-stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.howto{border-color:var(--accent)}
.howto summary{cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center}
.howto summary .role{margin:0}
.howto-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px}
.howto-grid h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.howto-grid ul,.howto-grid ol{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.qbtn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--accent);font:700 12px/1 var(--f-body);cursor:pointer;vertical-align:2px;margin-left:4px;padding:0}
/* guide */
.guide{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.guide{grid-template-columns:minmax(0,1fr)}.gnav{position:static!important;flex-direction:row!important;flex-wrap:wrap}}
.gnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:2px}
.gnav a{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:4px;border-left:2px solid transparent}
.gnav a:hover{color:var(--ink);border-left-color:var(--accent);background:var(--panel)}
.gbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.gsec{scroll-margin-top:12px}
.gsec h2{color:var(--ink);font-size:20px;margin-bottom:8px}
.gsec h3{margin:12px 0 6px;font-size:15px}
.gsec p,.gsec li,.gsec dd{max-width:68ch;font-size:14px}
.gsec p{margin:0 0 8px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps.big li::marker{font-family:var(--f-display);font-weight:700;color:var(--accent)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;margin:10px 0 0;border-radius:0 4px 4px 0}
.callout.no{border-left-color:var(--bad);background:var(--bad-soft)}
.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.rules li{padding-left:22px;position:relative}
.rules li::before{position:absolute;left:0;top:0;font-weight:700;font-family:var(--f-mono)}
.rules li.ok::before{content:"✓";color:var(--good)}
.rules li.no::before{content:"✕";color:var(--bad)}
.rules li.warn::before{content:"!";color:var(--md)}
.mods td{font-size:13px}
.mods td.num{font-weight:600;width:52px;text-align:center}
.mods .pos{color:var(--good)} .mods .neg{color:var(--bad)}
.can-tbl td{vertical-align:top;font-size:13px;min-width:140px}
.can-tbl td:first-child{min-width:170px}
.can{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:3px;margin-bottom:2px}
.can.yes{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.can.no{background:var(--bad-soft);color:var(--bad)}
.can.warn{background:var(--md-soft);color:var(--md)}
.can-note{display:block;color:var(--muted);font-size:12px}
.moves,.gloss{margin:0;display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:6px 14px}
@media (max-width:520px){.moves,.gloss{grid-template-columns:minmax(0,1fr)}.moves dd,.gloss dd{margin-bottom:6px}}
.moves dt,.gloss dt{font-weight:600}
.moves dd,.gloss dd{margin:0;color:var(--muted)}
.def-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.def-opt{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--sunk);flex-wrap:wrap}
/* classes */
.cls-filters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chipf{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipf.easy[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--panel)}
h3.cls-group{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cls{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.cls p{margin:0;font-size:13px}
.cls-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cls-top h4{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.1}
.kind{font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--accent);white-space:nowrap}
.lvl{align-self:flex-start;font-family:var(--f-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:1px 6px;border-radius:3px}
.lvl.easy{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.lvl.mid{background:var(--md-soft);color:var(--md)}
.lvl.hard{background:var(--bad-soft);color:var(--bad)}
.cls-meta{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;font-size:12px}
.cls-meta dt{color:var(--muted);font-weight:600}
.cls-meta dd{margin:0}
/* accounts */
.acct-wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acct{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;color:var(--ink);text-align:left}
.acct img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.acct span{display:flex;flex-direction:column;line-height:1.15}
.acct b{font-size:13px;font-weight:600}
.acct small{font-size:11px;color:var(--muted)}
.roster-lab{align-self:center;margin-right:2px}
.chip.mine{border-color:var(--accent)}
.chip .who-s{font-size:11px;opacity:.75;font-family:var(--f-body);font-weight:400}
.ro-banner{border:1px solid var(--md);background:var(--md-soft);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:13px}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mc{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.mc.sel{border-color:var(--accent)}
.mc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mc-top h3{font-size:19px;line-height:1.1}
.at-t{display:flex;gap:6px;align-items:center;white-space:nowrap}
.switch:disabled{opacity:.5;cursor:not-allowed}
/* campaigns & combat */
.tabs{flex-wrap:wrap}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);vertical-align:2px}
.camp-switch{display:flex;flex-direction:column;gap:1px}
.camp-switch select{min-width:160px;max-width:240px;padding:4px 6px}
.camp-of{min-width:150px}
.camp-hero .camp-title{font-family:var(--f-display);font-size:28px;font-weight:700;margin:2px 0;line-height:1.1;color:var(--ink)}
input.camp-title{border:1px dashed var(--line);background:transparent;padding:2px 6px;width:min(560px,100%)}
.j-form{border:1px dashed var(--line);border-radius:var(--r);padding:10px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.journal{display:flex;flex-direction:column;gap:8px}
.je{border-left:3px solid var(--line);padding:6px 12px;background:var(--sunk);border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:4px}
.je p{margin:0;font-size:14px;max-width:72ch}
.je-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.je-top h3{font-size:17px}
.jt{font-family:var(--f-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.je.session{border-left-color:var(--accent)} .je.quest{border-left-color:var(--md)} .je.npc{border-left-color:var(--sdc)} .je.place{border-left-color:var(--good)} .je.loot{border-left-color:var(--md)}
.je.done{opacity:.6} .je.done h3{text-decoration:line-through}
.pnotes{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;background:var(--sunk)}
.pn .btn{grid-row:1/3;grid-column:2;align-self:center}
.secret{border-color:var(--bad);border-style:dashed}
.cbt td{vertical-align:middle}
.cbt tr.cur{background:var(--accent-soft)}
.cbt tr.cur td:first-child{color:var(--accent);font-weight:700}
.cbt tr.foe td:nth-child(2) b{color:var(--bad)}
.cbt tr.spent{opacity:.55}
.npc{border-color:var(--bad)}
.npc-form{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.flag.warn{color:var(--md)}
/* training, level up & vehicles */
.training{border:1px dashed var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.tr-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tr-row select{width:auto;max-width:100%}
.wpchip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;background:var(--panel)}
.wpchip small{color:var(--muted);font-size:11px}
.wpchip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 4px;font-size:12px}
.h2h-notes summary{cursor:pointer;font-size:12px;color:var(--accent)}
.h2h-notes ul{margin:4px 0 0;padding-left:18px;font-size:12px}
.ask{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.tohit{color:var(--muted)} .tohit b{color:var(--ink)}
.xp-line{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px}
.xp-line select{width:auto;max-width:260px;margin-left:4px}
.xp-bar{flex:1;min-width:200px;display:flex;flex-direction:column;gap:3px}
.lvlup{border:2px solid var(--accent)}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:10px}
.lv-grid h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.lv-grid p{margin:0;font-size:13px}
.lv-roll{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.lv-val{color:var(--good);font-size:18px}
.veh{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.veh.inuse{border-color:var(--md);box-shadow:inset 3px 0 0 var(--md)}
.veh-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.veh-head select{width:auto}
.veh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.veh h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.locs td.n,.vw td.n{width:72px}
/* welcome */
.w-hero{position:relative;overflow:hidden;min-height:260px;display:flex;align-items:center;padding:28px 24px}
.w-lines{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.w-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--panel) 0,var(--panel) 38%,rgba(0,0,0,0) 72%)}
.w-copy .role{align-self:flex-start}
.w-copy{position:relative;z-index:1;max-width:620px;display:flex;flex-direction:column;gap:10px}
h2.w-title{font-family:var(--f-display);font-size:clamp(28px,5vw,44px);line-height:1.02;letter-spacing:.02em;color:var(--bright);text-transform:none;margin:0;text-wrap:balance;text-shadow:0 0 22px rgba(var(--acc-rgb),.35)}
h2.w-title::before{content:none}
.w-lede{font-size:16px;line-height:1.55;max-width:60ch;margin:0}
.w-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:10px}
.w-steps>div{border-left:2px solid var(--accent);padding:2px 0 2px 12px}
.w-steps p,.w-diff p,.w-power p{margin:4px 0 0;font-size:14px;line-height:1.5}
.w-n{font-size:12px;color:var(--rift);letter-spacing:.1em}
.w-p{max-width:72ch;margin:8px 0 12px;font-size:15px;line-height:1.55}
.w-powers{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.w-power{border:1px solid var(--line);background:var(--sunk);padding:10px 12px}
.w-power .lab{color:var(--rift)}
.w-power h3{font-size:17px;margin-top:2px}
.w-diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px}
.w-diff h3{color:var(--accent);font-size:16px}
.w-join{margin-top:10px}
@media (max-width:640px){.w-hero{padding:20px 14px}.w-lines{opacity:.35}.w-hero::after{background:linear-gradient(180deg,rgba(0,0,0,0),var(--panel) 30%)}}
/* house rules */
.rules-list{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.hr{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--sunk)}
.hr.on{border-color:var(--accent);background:var(--accent-soft)}
.hr-body{flex:1;min-width:0}
.hr-body p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.hr.on .hr-body p{color:var(--ink)}
.hr-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tagx{font-family:var(--f-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:1px 6px;border-radius:3px}
.tagx.book{background:var(--sdc-soft);color:var(--sdc)} .tagx.home{background:var(--md-soft);color:var(--md)}
.switch{flex:none;width:40px;height:22px;border-radius:11px;border:1px solid var(--line);background:var(--line);position:relative;cursor:pointer;padding:0;margin-top:1px}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){.switch i{transition:none}}
.lethal{margin-top:10px;border:2px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lethal>b{color:var(--bad)}
.in-play{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
.mobile-only{display:none}
@media (max-width:960px){.mobile-only{display:inline-block}.dock.hide-m{display:none}.main.hide-m{display:none}}
@media (prefers-reduced-motion:no-preference){.entry.new{animation:drop .35s ease-out}@keyframes drop{from{transform:translateY(-6px);background:var(--accent-soft)}}}

/* ===================== RIFTS FIELD TERMINAL SKIN ===================== */
html{background:var(--bg)}
body{font-size:15px;letter-spacing:.005em;
  background:
    radial-gradient(1200px 600px at 85% -10%,var(--haze1),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,var(--haze2),transparent 60%),
    linear-gradient(var(--gridl) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,var(--gridl) 1px,transparent 1px) 0 0/32px 100%,
    var(--bg);
  background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:var(--scan);
  background:repeating-linear-gradient(to bottom,var(--scanl) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
::selection{background:rgba(var(--acc-rgb),.35);color:var(--bright)}
h1,h2,h3,.lab,.btn,.tab,.chip,.role,.flag,.tagx,.lvl,.jt,.chipf{font-family:var(--f-display)}
h2{letter-spacing:.14em;font-size:15px;color:var(--accent)}
h2::before{content:"// ";color:var(--muted);font-family:var(--f-mono);letter-spacing:0}
.gsec h2,.empty h2,.starter-head h2,.camp-hero h2,.lvlup h2,.npc h2,.sec-head h2[style]{color:var(--ink)}
h3{letter-spacing:.03em}
.lab{letter-spacing:.14em;font-size:11px}

/* command bar */
.bar{position:relative;border-bottom:0;padding-bottom:14px;margin-bottom:4px}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--accent) 0,var(--accent) 120px,var(--line) 120px,var(--line) calc(100% - 60px),var(--rift) calc(100% - 60px));box-shadow:0 0 12px rgba(var(--acc-rgb),.35)}
.bar h1{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.16em;color:var(--ink);text-shadow:0 0 18px rgba(var(--acc-rgb),.35)}
.bar h1 .rf{color:var(--accent)}
.bar .sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:4px}
.bar .sub .live{color:var(--good)}
.bar .sub .live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);margin-right:6px;vertical-align:1px;animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.25}}
.bar .sub .live.off{color:var(--md)} .bar .sub .live.off::before{background:var(--md);box-shadow:0 0 8px var(--md)}

/* panels: gunmetal plates with HUD corner brackets */
.panel,.starter,.cls,.mc,.lib-card,.gear-card,.veh,.dmgbox{position:relative;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(180deg,var(--sheen),transparent 40px),var(--panel)}
.panel::before,.starter::before,.mc::before,.dmgbox::before,.veh::before{content:"";position:absolute;inset:-1px;pointer-events:none;
  background:
    linear-gradient(var(--accent),var(--accent)) top left/14px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top left/2px 14px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/14px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/2px 14px no-repeat;opacity:.75}
.gear-card,.cls,.lib-card,.mc{background:var(--sunk)}
.dmgbox{border:1px solid rgba(var(--bad-rgb),.45);background:linear-gradient(180deg,rgba(var(--bad-rgb),.06),transparent 60px),var(--panel)}
.dmgbox::before{background:
    linear-gradient(var(--bad),var(--bad)) top left/14px 2px no-repeat,linear-gradient(var(--bad),var(--bad)) top left/2px 14px no-repeat,
    linear-gradient(var(--bad),var(--bad)) bottom right/14px 2px no-repeat,linear-gradient(var(--bad),var(--bad)) bottom right/2px 14px no-repeat}
.dmgbox h2{color:var(--bad)!important}
.howto,.lvlup{border-color:rgba(var(--acc-rgb),.5);box-shadow:var(--glow)}
.secret,.npc{border-color:rgba(var(--rift-rgb),.5)}
.secret h2,.npc h2{color:var(--rift)!important}
.empty{background:radial-gradient(500px 200px at 50% 0,rgba(var(--acc-rgb),.08),transparent 70%),var(--panel)}

/* buttons: angular plates */
.btn{border-radius:0;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
  background:var(--plate);border:1px solid var(--edge3);color:var(--ink);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600;padding:6px 14px}
.btn:hover{border-color:var(--accent);color:var(--bright);background:var(--plate-h)}
.btn.pri{background:linear-gradient(180deg,var(--pri-a),var(--pri-b));color:var(--on-accent);border-color:var(--pri-edge);text-shadow:none}
.btn.pri:hover{background:linear-gradient(180deg,var(--pri-ha),var(--pri-hb))}
.btn.sm{font-size:11px;padding:3px 10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger:not(.ghost){border-color:rgba(var(--bad-rgb),.5)}
.btn:disabled{opacity:.35}
.linkbtn{color:var(--accent)}

/* tabs: HUD rail */
.tabs{border-bottom:1px solid var(--line);gap:0}
.tab{font-size:14px;letter-spacing:.12em;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted);position:relative}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);text-shadow:0 0 10px rgba(var(--acc-rgb),.5);background:linear-gradient(0deg,rgba(var(--acc-rgb),.10),transparent)}

/* roster chips & pills */
.chip,.chipf,.pill,.wpchip{border-radius:0;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.chip{background:var(--plate2);border-color:var(--edge);font-size:14px;letter-spacing:.04em}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 12px rgba(var(--acc-rgb),.25)}
.chip.mine{border-color:rgba(var(--acc-rgb),.6)}
.chipf[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chipf.easy[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on-good)}
.role{background:var(--rift-soft);color:var(--rift);border-radius:0;letter-spacing:.16em}
.kind{color:var(--rift)}
.acct{border-radius:0;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);background:var(--plate2);border-color:var(--edge)}
.acct img{border-radius:0;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}

/* fields */
input,select,textarea{background:var(--field);border:1px solid var(--edge2);border-radius:0;color:var(--ink);font-family:var(--f-body)}
input[type=number],.num{font-family:var(--f-mono)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 12px rgba(var(--acc-rgb),.25)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input::placeholder,textarea::placeholder{color:var(--ph)}

/* attributes as readout cells */
.attr{background:var(--field);border-color:var(--edge2);border-radius:0}
.attr .lab{color:var(--accent)}
.attr input{font-family:var(--f-mono);font-size:22px;background:transparent;border-color:transparent;color:var(--bright)}
.attr .eff b{color:var(--good)}
.pen,.attr .eff b.pen{color:var(--bad)}

/* gauges: segmented armor / energy bars */
.meter{height:8px;background:var(--field);border:1px solid var(--edge2);border-radius:0;position:relative}
.meter i{border-radius:0;background:var(--accent);box-shadow:0 0 10px rgba(var(--acc-rgb),.5)}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--field) 9px 11px);pointer-events:none}
.pool{background:var(--field);border-color:var(--edge2);border-radius:0}
.pool .val{font-family:var(--f-mono);color:var(--bright);font-size:20px}
.pool.md .meter i{background:var(--md);box-shadow:0 0 10px rgba(var(--md-rgb),.5)}
.pool.sdc .meter i{background:var(--sdc);box-shadow:0 0 10px rgba(var(--sdc-rgb),.4)}
.pool.hp .meter i{background:var(--bad);box-shadow:0 0 10px rgba(var(--bad-rgb),.5)}
.pool:nth-child(4) .meter i,.pool:nth-child(5) .meter i{background:var(--rift);box-shadow:0 0 10px rgba(var(--rift-rgb),.5)}
.tag{border-radius:0;letter-spacing:.08em}
.tag.md{background:var(--md-soft);color:var(--md);box-shadow:inset 0 0 0 1px rgba(var(--md-rgb),.35)}
.tag.sdc{background:var(--sdc-soft);color:var(--sdc);box-shadow:inset 0 0 0 1px rgba(var(--sdc-rgb),.3)}

/* combat readouts */
.cstat{background:var(--field);border-color:var(--edge2);border-radius:0}
.cstat .tot{font-family:var(--f-mono);font-size:24px;color:var(--bright)}
.save{background:var(--field);border-color:var(--edge2);border-radius:0}
.pip{border-radius:0;transform:rotate(45deg);width:14px;height:14px;border-color:var(--accent);margin:0 2px}
.pip.used{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.training,.j-form{border-color:var(--edge)}
.ask,.callout{background:var(--accent-soft);border-color:var(--accent)}

/* comms log (dice) */
.dock .panel:first-child{border-color:rgba(var(--acc-rgb),.4)}
.dice-btns .btn{font-family:var(--f-mono);letter-spacing:.02em;font-size:13px}
.entry{background:var(--field);border-color:var(--edge2);border-radius:0;border-left:2px solid var(--edge)}
.entry .who{font-family:var(--f-mono);letter-spacing:.02em}
.entry .tot{font-family:var(--f-mono);font-size:26px;color:var(--bright)}
.entry.crit{border-left-color:var(--rift);background:linear-gradient(90deg,var(--rift-soft),transparent 70%),var(--field)}
.entry.crit .tot{color:var(--rift);text-shadow:0 0 12px rgba(var(--rift-rgb),.6)}
.entry.ok{border-left-color:var(--good)} .entry.ok .tot{color:var(--good)}
.entry.fail{border-left-color:var(--bad)} .entry.fail .tot{color:var(--bad)}
.flag{letter-spacing:.1em}
.flag.crit{color:var(--rift)}

/* tables */
th{color:var(--accent);letter-spacing:.14em;font-size:11px;border-bottom-color:var(--edge)}
td{border-bottom-color:var(--edge4)}
tr.grp td{color:var(--rift);border-bottom-color:rgba(var(--rift-rgb),.35)}
.cbt tr.cur{background:linear-gradient(90deg,rgba(var(--acc-rgb),.16),transparent)}
.cbt tr.cur td:first-child{color:var(--accent);text-shadow:0 0 8px var(--accent)}

/* misc */
.notice{border-color:var(--edge);background:var(--field);border-radius:0;font-family:var(--f-mono);font-size:12px}
.result{background:var(--accent-soft);border-left-color:var(--accent);font-family:var(--f-mono);font-size:12px}
.lethal{border-radius:0;background:repeating-linear-gradient(-45deg,rgba(var(--bad-rgb),.10) 0 10px,rgba(var(--bad-rgb),.04) 10px 20px)}
.ro-banner{border-radius:0;background:repeating-linear-gradient(-45deg,rgba(var(--md-rgb),.10) 0 10px,rgba(var(--md-rgb),.04) 10px 20px);border-color:var(--md)}
.switch{border-radius:0;background:var(--plate);border-color:var(--edge3)}
.switch i{border-radius:0;background:var(--muted)}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hr{background:var(--field);border-radius:0}
.hr.on{background:var(--accent-soft)}
.je{background:var(--field)}
.je.session{border-left-color:var(--accent)} .je.npc{border-left-color:var(--rift)}
.gnav a{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.gnav a:hover{background:var(--accent-soft);border-left-color:var(--accent)}
.qbtn{border-radius:0;background:var(--plate);border-color:var(--edge3);color:var(--accent)}
.seg{border-radius:0}
.seg button{background:var(--plate);color:var(--ink);font-family:var(--f-mono)}
.seg button[aria-pressed="true"].md{background:var(--md);color:var(--on-md)}
.seg button[aria-pressed="true"].sdc{background:var(--sdc);color:var(--on-sdc)}
.lvl.easy{background:rgba(var(--good-rgb),.12)} .lvl,.tagx{border-radius:0}
.st-stats{color:var(--muted)}
.wpchip{background:var(--plate2);border-color:var(--edge)}
@media (prefers-reduced-motion:reduce){.bar .sub .live::before{animation:none}}
.skin{display:inline-flex;border:1px solid var(--edge3);background:var(--plate)}
.skin button{border:0;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;cursor:pointer}
.skin button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.acct-wrap{align-items:flex-end}
@media (max-width:640px){.bar h1{font-size:24px;letter-spacing:.12em}body::after{display:none}}

/* ---------- dice ---------- */
function rollExpr(expr){
  const src=String(expr||"").toLowerCase().replace(/\s+/g,"").replace(/×/g,"x");
  if(!src) throw new Error("Type a roll like 2d6+3 or 1d6x10");
  const re=/([+-]?)(?:(\d*)d(\d+)(?:[x*](\d+))?|(\d+))/gy;
  let m,total=0,parts=[],dice=[],pos=0;
  while(pos<src.length){
    re.lastIndex=pos; m=re.exec(src);
    if(!m) throw new Error(`Can't read "${expr}". Try 3d6, 1d20+4 or 1d6x10`);
    pos=re.lastIndex;
    const sign=m[1]==="-"?-1:1;
    if(m[3]){
      const n=Math.min(+(m[2]||1),100), s=+m[3], mult=+(m[4]||1);
      if(!s) throw new Error("A die needs at least one side");
      const r=Array.from({length:n},()=>1+Math.floor(Math.random()*s));
      dice.push(...r.map(v=>({v,s})));
      const sum=r.reduce((a,b)=>a+b,0)*mult;
      total+=sign*sum;
      parts.push(`${sign<0?"−":parts.length?"+":""}[${r.join(",")}]${mult>1?"×"+mult:""}`);
    } else { total+=sign*(+m[5]); parts.push(`${sign<0?"−":"+"}${m[5]}`) }
  }
  return {total,detail:parts.join(" "),dice};
}

function applyDamage(c,amt,type,strikeRoll){

  // worn layers, outermost first (list order); A.R. layers are skipped when the strike beats the A.R.
  const layers=(c.armor||[]).filter(x=>x.equipped&&+x.cur>0).filter(x=>{
    if(+x.ar>0&&sr!=null&&sr>+x.ar){msgs.push(`strike ${sr} beats ${x.name}'s A.R. ${x.ar}`);return false}
    return true});
  const mdcBeing=+c.mdc.max>0;
  if(type==="SDC"&&(layers.length||mdcBeing)){
    if(sdc<100){msgs.push(`${sdc} S.D.C. bounces off: M.D.C. targets ignore S.D.C. hits under 100 in a single attack`);return msgs.join("; ")+"."}

  }

  // Only later attacks reach the next layer or the body (book: once armor is gone, further attacks hit the character).
  const armor=md>0?layers[0]:null;
  if(armor){
    const before=+armor.cur, take=Math.min(md,before); armor.cur=before-take;
    if(armor.cur<=0){ msgs.push(`${armor.name} takes ${take} M.D. and is destroyed${md>take?`; the other ${md-take} M.D. is stopped`:""}. Next hits go to ${layers[1]?layers[1].name:"the body"}`); info.broke.push(armor.name) }
    else { msgs.push(`${armor.name} absorbs ${take} M.D. (${armor.cur} left)`);
      if(+armor.max>0&&armor.cur<=+armor.max*0.25) info.low.push(armor.name) }
    md=0;
  }
  if(sr==null&&armor&&+armor.ar>0) msgs.push("no strike roll entered, so the A.R. layer was assumed hit");
  if(md>0&&c.hpMdc){
    c.hp.cur=+c.hp.cur-md; msgs.push(`Hit Points act as M.D.C.: −${md} (now ${c.hp.cur})`);
    if(c.hp.cur<=0) msgs.push("at or below 0: coma, save vs coma/death"); md=0;
  }
  if(md>0&&mdcBeing){
    const take=Math.min(md,+c.mdc.cur); c.mdc.cur=+c.mdc.cur-take; md-=take;
    msgs.push(`natural M.D.C. −${take} (${c.mdc.cur} left)`);
    if(c.mdc.cur<=0) msgs.push("M.D.C. at zero: coma, needs healing");
    md=0;
  }
  const fromMD=md>0;
  if(md>0){ sdc+=md*100; msgs.push(`${md} M.D. hits flesh as ${md*100} S.D.C.`) }
  if(sdc>0){
    const s=Math.min(sdc,Math.max(0,+c.sdc.cur)); c.sdc.cur=+c.sdc.cur-s; sdc-=s;
    if(s) msgs.push(`S.D.C. −${s}`);
    if(sdc>0){ c.hp.cur=+c.hp.cur-sdc; msgs.push(`Hit Points −${sdc} (now ${c.hp.cur})`);
      if(c.hp.cur<=0){ const dead=c.hp.cur<=-(+c.attrs.PE||0); msgs.push(dead?"below −P.E.: dead":"at or below 0 H.P.: coma, save vs coma/death");
        if(dead) info.lethal=fromMD?"md":"sdc"; } }
  }
  applyDamage.info=info;
  return msgs.join("; ")+".";
}
applyDamage.info={lethal:false,low:[],broke:[]};

 {id:"armorWarn",name:"Armor warning",tag:"Homebrew",text:"When worn armor drops to 25% of its M.D.C. or less, the app warns the whole table in the log so the player knows it's time to retreat or repair."},

const ruleOn=id=>!!(S.house&&S.house.on&&S.house.on[id]);

/* ---------- campaigns ----------
   gms/<gm>/camps/<cid>                 campaign info (only its G.M. or the page owner can write)
   gms/<gm>/camps/<cid>/state/house     house rules           gms/<gm>/camps/<cid>/state/combat   combat tracker
   gms/<gm>/camps/<cid>/journal/<id>    G.M. journal          gms/<gm>/lib/bestiary               G.M.'s saved enemies
   table/<key>/rolls/<id>               shared dice log       table/<key>/notes/<id>              party notes (any player)
   data/users/<gm>/secret-<cid>         G.M.-only secret notes (private to that viewer)                                      */
const campKey=(gm,cid)=>`${gm}:${cid}`;
const splitKey=k=>{const i=(k||"").indexOf(":");return i<0?[null,null]:[k.slice(0,i),k.slice(i+1)]};
const curCamp=()=>S.camp&&S.camps[S.camp]?S.camps[S.camp]:null;
const campBase=k=>{const [g,c]=splitKey(k);return `gms/${g}/camps/${c}`};
function isGM(){ if(S.local) return true; if(S.isAdmin) return true; const cc=curCamp(); return !!cc&&cc.gm===S.me }
function rollsPath(){return S.camp&&curCamp()?`table/${S.camp}/rolls`:"rolls"}
function housePath(){return S.camp&&curCamp()?`${campBase(S.camp)}/state/house`:"settings/house"}
function inCamp(id){const c=S.chars[id];if(!c) return false;return S.camp?c.campaign===S.camp:(c.atTable!==false&&!c.campaign)}
const JTYPES=[["session","Session"],["quest","Quest"],["npc","NPC"],["place","Place"],["loot","Loot"],["note","Note"]];

let campUnsubs=[];
function subCampaign(){
  campUnsubs.forEach(u=>{try{u()}catch(e){}}); campUnsubs=[];
  S.journal=[]; S.partyNotes=[]; S.combat=null; S.secret=null; S.house=houseDefaults(); S.rolls=[];
  if(S.local||!S.db){render();return}
  const db=S.db, cc=curCamp();
  campUnsubs.push(db.doc(housePath()).onSnapshot(s=>{S.house=s.exists?{...houseDefaults(),...structuredClone(s.data())}:houseDefaults();render()},()=>{}));
  campUnsubs.push(db.collection(rollsPath()).orderBy("ts","desc").limit(40).onSnapshot(snap=>{
    const remote=snap.docs.map(d=>d.data());const ids=new Set(remote.map(r=>r.id));
    const pending=S.rolls.filter(r=>!ids.has(r.id)&&Date.now()-r.ts<5000);
    S.rolls=[...pending,...remote].sort((a,b)=>b.ts-a.ts).slice(0,40);renderDock()},()=>{}));
  if(cc){
    const base=campBase(S.camp);
    campUnsubs.push(db.collection(`${base}/journal`).onSnapshot(s=>{S.journal=s.docs.map(d=>({id:d.id,...structuredClone(d.data())}));renderMainSoft()},()=>{}));
    campUnsubs.push(db.collection(`table/${S.camp}/notes`).onSnapshot(s=>{S.partyNotes=s.docs.map(d=>({id:d.id,...structuredClone(d.data())}));renderMainSoft()},()=>{}));
    campUnsubs.push(db.doc(`${base}/state/combat`).onSnapshot(s=>{if(!S.combatDirty){S.combat=s.exists?structuredClone(s.data()):null;render()}},()=>{}));
    if(cc.gm===S.me) db.doc(`data/users/${S.me}/secret-${cc.cid}`).get().then(s=>{S.secret=s.exists?(s.data().text||""):"";renderMainSoft()}).catch(()=>{});
  }
  render();
}
// re-render without stealing focus from text boxes being typed in
function renderMainSoft(){const a=document.activeElement;if(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="number"&&a.type!=="checkbox"))&&!a.dataset.k) return;renderMain()}
function setCamp(k){S.camp=k||"";try{localStorage.setItem("rft.camp",S.camp)}catch(e){}S.combat=null;
  if(S.sel&&!inCamp(S.sel)) S.sel=Object.keys(S.chars).find(id=>inCamp(id)&&isMine(id))||Object.keys(S.chars).find(inCamp)||Object.keys(S.chars).find(isMine)||null;
  subCampaign()}
async function createCampaign(name,desc){
  if(!S.me||!S.db){showStatus("Sign in to create a campaign.");return}
  const cid=uid(), data={name:name||"New campaign",desc:desc||"",next:"",created:Date.now(),gm:S.me};
  try{const gi=S.db.doc("gms/"+S.me);const g=await gi.get();if(!g.exists) await gi.set({joined:Date.now()});
    await S.db.doc(`gms/${S.me}/camps/${cid}`).set(data);
    S.camps[campKey(S.me,cid)]={...data,cid,gm:S.me}; setCamp(campKey(S.me,cid)); S.tab="campaign"; render()}
  catch(e){showStatus(writeError(e))}
}
async function saveCampInfo(patch){
  const cc=curCamp(); if(!cc||!isGM()) return; Object.assign(cc,patch);
  try{await S.db.doc(campBase(S.camp)).update(patch)}catch(e){showStatus(writeError(e))}
}

/* ---- combat tracker ---- */
function cbDefault(){return {round:1,turn:-1,list:[],updated:Date.now()}}
function cbStats(e){ // live numbers for a combatant; PCs read from their sheet
  if(e.kind==="pc"){const c=S.chars[e.charId];if(!c) return null;const t=combatTotals(c);
    return {name:c.name,init:t.init.base+t.init.add,attacks:attacksOf(c),strike:t.strike.base+t.strike.add,parry:t.parry.base+t.parry.add,dodge:t.dodge.base+t.dodge.add,hp:c.hp,sdc:c.sdc,armor:(c.armor||[]).find(a=>a.equipped&&+a.cur>0)}}
  return {name:e.name,init:+e.initB||0,attacks:+e.attacks||1,strike:+e.strike||0,parry:+e.parry||0,dodge:+e.dodge||0}
}
function condition(e){const m=e.mdc||{};const max=+m.max||0;if(!max) return "";const p=(+m.cur||0)/max;
  return p<=0?["Down","fail"]:p<0.35?["Badly hurt","fail"]:p<0.75?["Hurt","warn"]:["Unhurt","ok"]}
async function saveCombat(){
  if(!isGM()||!S.camp) return; S.combat.updated=Date.now(); S.combatDirty=true;
  try{await S.db.doc(`${campBase(S.camp)}/state/combat`).set(JSON.parse(JSON.stringify(S.combat)))}catch(e){showStatus(writeError(e))}
  S.combatDirty=false; render();
}
function combatView(){
  const cc=curCamp(); if(!cc) return `<section class="panel empty"><h2>Combat</h2><p>Open a campaign first. Each campaign has its own combat tracker.</p><button class="btn pri" data-act="tab" data-v="campaign">Go to campaigns</button></section>`;
  const gm=isGM(), cb=S.combat||cbDefault(), list=cb.list||[];
  const order=list.map((e,i)=>[e,i]);
  const party=Object.keys(S.chars).filter(id=>S.chars[id].campaign===S.camp&&!list.some(e=>e.charId===id));
  const lib=S.bestiary||[];
  return `<div class="stack">
    <section class="panel"><div class="sec-head"><div><span class="role">Melee round ${cb.round||1}</span><h2 style="color:var(--ink);font-size:22px">Combat</h2></div>

/* ---------- persistence ---------- */
/* accounts: each player's characters live at players/<id>/chars/<charId>;
   older shared characters stay at characters/<charId> until someone claims them */
const pathOf=id=>S.paths[id]||("characters/"+id);
const ownerOf=id=>{const p=S.paths[id]||"";return p.startsWith("players/")?p.split("/")[1]:(S.chars[id]?.owner||null)};
const isMine=id=>!!S.me&&ownerOf(id)===S.me&&(S.paths[id]||"").startsWith("players/");
const isLegacy=id=>!(S.paths[id]||"").startsWith("players/");
function canEdit(id){
  if(S.local||!S.chars[id]) return true;
  if(S.isAdmin) return true;
  if(isLegacy(id)) return true;
  return isMine(id);
}
const ownerName=id=>{const o=ownerOf(id);if(!o) return "the table";if(o===S.me) return "you";return S.names[o]||"another player"};
function setSource(key,entries){S.src[key]=entries;rebuildChars()}
function rebuildChars(){
  const next={},paths={};
  for(const ents of Object.values(S.src)) for(const [id,path,data] of ents){
    next[id]=(S.dirty.has(id)||S.inflight[id])&&S.chars[id]?S.chars[id]:data; paths[id]=path; S.pendingNew.delete(id) }
  for(const id of [...S.dirty,...S.pendingNew]) if(S.chars[id]&&!next[id]){next[id]=S.chars[id];paths[id]=S.paths[id]}
  S.chars=next; S.paths=paths;
  if(!S.picked&&S.wantSel&&S.chars[S.wantSel]) S.sel=S.wantSel;
  if(!S.sel||!S.chars[S.sel]) S.sel=Object.keys(S.chars).find(isMine)||Object.keys(S.chars).find(id=>S.chars[id].atTable!==false)||null;
  resolveNames(); render();
}
async function resolveNames(){
  if(!S.user) return;
  const ids=[...new Set(Object.keys(S.chars).map(ownerOf).filter(Boolean))].filter(x=>!(x in S.names));
  if(!ids.length) return;
  try{const ps=await S.user.profiles(ids);let ch=false;for(const id of ids){S.names[id]=ps[id]?.name||"";ch=true}if(ch){renderRoster();renderMain()}}catch(e){}
}
const RO_ACTS=new Set(["veh-add","veh-use","veh-repair","loc-add","loc-rm","vw-add","vw-rm","vw-reload","vw-fire","lvl-open","lvl-roll","lvl-apply","wp-rm","h2h-yes","h2h-no","w-parry","add-skill","add-armor","add-weapon","add-power","rm","mv","repair","reload","pip","new-melee","apply-dmg","lib-add","del-ask","del-yes","use-power","w-strike","w-aimed","bto-stab","dtype"]);
async function claimChar(id){
  const c=S.chars[id]; if(!c||!S.me||!S.db) return;
  const data=JSON.parse(JSON.stringify(c)); data.owner=S.me; data.atTable=c.atTable!==false;
  const path=`players/${S.me}/chars/${id}`;
  try{ await S.db.doc(path).set(data); await S.db.doc(pathOf(id)).delete(); S.paths[id]=path; showStatus("") }
  catch(e){ showStatus(writeError(e)) }
}
function touch(id){
  const c=S.chars[id]; if(!c) return; c.updated=Date.now();
  if(S.local) return;
  if(!canEdit(id)){showStatus(`${c.name} belongs to ${ownerName(id)}. Only they or the G.M. can change it.`);return}
  S.dirty.add(id); clearTimeout(S.saveTimers[id]);
  S.saveTimers[id]=setTimeout(()=>flush(id),600);
}
async function flush(id){
  if(S.inflight[id]){S.saveTimers[id]=setTimeout(()=>flush(id),300);return}
  const c=S.chars[id]; if(!c){S.dirty.delete(id);return}
  S.inflight[id]=true;
  try{ await S.db.doc(pathOf(id)).set(JSON.parse(JSON.stringify(c))); }
  catch(e){ showStatus(writeError(e)) }
  finally{ S.inflight[id]=false; if(!S.saveTimers[id]||true){ /* settle */ } S.dirty.delete(id) }
}
function writeError(e){
  if(e?.code==="invalid_argument") return "You can view this table but not change it. Ask the owner to give you Contributor access.";
  if(e?.code==="quota_exceeded") return "Storage is full. Delete old characters to make room.";
  return "Couldn't save just now. Your change will be retried when you edit again.";
}
function showStatus(t){const el=document.getElementById("status");el.textContent=t;el.hidden=!t}

async function addChar(c){
  const id=uid(); c.owner=S.me||null; c.atTable=true; c.campaign=S.camp&&curCamp()?S.camp:""; S.chars[id]=c; S.sel=id; remember();
  S.paths[id]=S.me&&!S.local?`players/${S.me}/chars/${id}`:"characters/"+id;
  S.pendingNew.add(id);
  if(!S.local){ try{await S.db.doc(S.paths[id]).set(JSON.parse(JSON.stringify(c)))}catch(e){showStatus(writeError(e))} }
  render();
}
async function delChar(id){
  const path=pathOf(id);
  delete S.chars[id]; S.pendingNew.delete(id); if(S.sel===id) S.sel=null; remember();
  if(!S.local){ try{await S.db.doc(path).delete()}catch(e){showStatus(writeError(e))} }
  render();
}
function remember(){try{localStorage.setItem("rft.sel",S.sel||"");localStorage.setItem("rft.tab",S.tab);if(S.tab!=="welcome")localStorage.setItem("rft.seenWelcome","1")}catch(e){}}

async function logRoll(entry){
  entry.by=S.me||null; entry.ts=Date.now(); entry.id=uid();
  if(S.local){ S.rolls.unshift(entry); S.rolls=S.rolls.slice(0,40); renderDock(); return }
  S.rolls.unshift(entry); renderDock();
  try{ await S.db.collection(rollsPath()).doc(entry.id).set(entry); }
  catch(e){ showStatus(writeError(e)) }
  if(++S.rollCount%20===0) prune();
}
async function prune(){
  try{const p=rollsPath();const q=await S.db.collection(p).orderBy("ts","desc").limit(400).get();
    for(const doc of q.docs.slice(80)){ await S.db.doc(p+"/"+doc.id).delete() }}catch(e){}
}

/* ---------- roll actions ---------- */
const sgn=n=>(n>=0?"+":"−")+Math.abs(n);
function d20Roll(label,bonus,opts={}){
  const c=cur(), r=d(20), tot=r+bonus;
  let flag="",cls="";
  if(opts.kind==="strike"){
    if(r===20){flag="Natural 20 · critical, double damage";cls="crit"}
    else if(r===1){flag="Natural 1 · automatic miss";cls="fail"}
    else if(opts.ranged&&tot<8){flag="Ranged attacks need 8+ · miss";cls="fail"}
    else if(tot<=4){flag="1–4 always misses";cls="fail"}
    else if(opts.ranged){flag="Hits on 8+ unless dodged"}
  } else if(opts.target){
    if(r===1){flag="Natural 1 · fails";cls="fail"}
    else if(tot>=opts.target){flag=`Saves (needs ${opts.target}+)`;cls="ok"}
    else{flag=`Fails (needs ${opts.target}+)`;cls="fail"}
  } else if(opts.kind==="defend"){ if(r===20){flag="Natural 20";cls="crit"} else flag="Ties go to the defender" }
  else if(r===20){flag="Natural 20";cls="crit"}
  logRoll({char:opts.who||c?.name||"",label,detail:`d20 [${r}] ${sgn(bonus)}`,total:tot,flag,cls});
  return r;
}
function skillRoll(s){
  const c=cur(),pct=skillPct(c,s),r=d(100);
  const ok=r<=pct;
  logRoll({char:c.name,label:s.name||"Skill",detail:`d100 [${r}] vs ${pct}%`,total:r,flag:ok?"Success":"Failure",cls:ok?"ok":"fail"});
}
function weaponFire(w,mode){
  const c=cur();
  if(mode==="strike"||mode==="aimed"){
    const melee=String(w.range||"").toLowerCase().trim()==="melee";
    const t=combatTotals(c); let bonus=(+w.strike||0)+wpAt(w.wp,c.level).s+(melee?t.strike.base+t.strike.add:0);
    if(mode==="aimed") bonus+=2+(+w.aimed||0);
    if(+w.shotsMax>0){ if(+w.shots<=0){logRoll({char:c.name,label:`${w.name}: click`,detail:"Out of ammo",total:0,flag:"Reload first",cls:"fail"});return}
      w.shots=+w.shots-1; touch(S.sel); }
    if(mode==="aimed"&&attacksOf(c)){c.combat.used=Math.min(attacksOf(c),(+c.combat.used||0)+2);touch(S.sel)}
    else if(+c.combat.used<attacksOf(c)){c.combat.used=(+c.combat.used||0)+1;touch(S.sel)}
    const nat=d20Roll(`${w.name}: ${mode==="aimed"?"aimed shot (2 attacks)":melee?"strike":"shot"}`,bonus,{kind:"strike",ranged:!melee});
    S.critW=nat===20?{id:S.sel,i:c.weapons.indexOf(w),veh:w._veh||null}:null;
    renderMain();
  } else {
    try{ const r=rollExpr(w.dmg); let tot=r.total, det=`${w.dmg} ${r.detail}`;
      if(w.type!=="MD"&&w.range==="melee"){const t=combatTotals(c);const add=t.dmg.base+t.dmg.add;if(add){tot+=add;det+=` ${sgn(add)} P.S./H2H`}}
      const crit=S.critW&&S.critW.id===S.sel&&S.critW.i===c.weapons.indexOf(w);
      if(crit){tot*=2;det+=" ×2 critical";S.critW=null;renderMain()}
      logRoll({char:c.name,label:`${w.name}: damage${crit?" (critical)":""}`,detail:det,total:tot,flag:w.type==="MD"?"M.D.":"S.D.C.",cls:crit?"crit":"",dtype:w.type});
    }catch(e){showStatus(e.message)}
  }
}

function inp(k,v,type="text",extra=""){return `<input id="f-${k.replace(/\./g,"-")}" data-k="${k}" type="${type}" value="${esc(v)}" ${type==="number"?'inputmode="numeric"':""} ${S.ro?"readonly":""} ${extra}>`}

function renderAccount(){

function renderRoster(){

    +`<button class="btn sm ghost mobile-only" data-act="mview" data-v="${S.mview==="dice"?"sheet":"dice"}">${S.mview==="dice"?"Back to sheet":"Dice & log"}</button>`;

  <section class="panel"><h2>How the world ended</h2>
    <div class="w-steps">
      <div><span class="w-n num">01</span><h3>A golden age</h3><p>Humanity's near future was a time of wonders: cured diseases, long lives, robots and flying cars. Peace and plenty, at last.</p></div>
      <div><span class="w-n num">02</span><h3>The Great Cataclysm</h3><p>A chain of disasters released a surge of mystic energy. Rivers of blue power, called <b>ley lines</b>, blazed across the planet, and where they crossed, space itself tore open into <b>Rifts</b>.</p></div>
      <div><span class="w-n num">03</span><h3>The Dark Age</h3><p>Monsters, demons, gods and alien beings came through. Civilization collapsed. For roughly two centuries people fought just to survive, and much of history was lost.</p></div>
      <div><span class="w-n num">04</span><h3>Today: 109 P.A.</h3><p>"Post Apocalypse." The Rifts have calmed but still open without warning. Earth is a patchwork of alien realms, and humanity is rebuilding, or conquering.</p></div>
    </div>
  </section>

  <section class="panel"><h2>The world today</h2>
    <p class="w-p">North America, where most games start, is a frontier. Walled high-tech cities stand next to wilderness full of dinosaurs and dragons. Humans share the land with <b>D-Bees</b>, beings from other dimensions who came through the Rifts and now call Earth home. Magic and technology both work, and most people fear one or the other.</p>
    <div class="w-powers">${POWERS.map(([n,t,d])=>`<article class="w-power"><span class="lab">${esc(t)}</span><h3>${esc(n)}</h3><p>${esc(d)}</p></article>`).join("")}</div>
  </section>

  <section class="panel"><h2>What makes Rifts different</h2>
    <div class="w-diff">
      <div><h3>Anything goes</h3><p>One party might be a knight with a sword made of psychic energy, a chemically boosted super-soldier, a mage, a dragon and a robot. Rifts lets you mix them all.</p></div>
      <div><h3>Mega-Damage</h3><p>Rifts has two scales of power. Ordinary weapons do S.D.C. damage, but lasers, magic and monsters do <b>Mega-Damage</b>, a hundred times worse. Armor isn't optional; it's how you stay alive.</p></div>
      <div><h3>Magic vs. machine</h3><p>Ley lines power spells; factories power guns. Who you trust, the Coalition's tech or the free cities' magic, shapes your story.</p></div>
      <div><h3>Heroes in a hard world</h3><p>Towns need protecting, refugees need escorting, and the Coalition hunts anyone different. It's a big, dangerous world where a few brave people can make a real difference.</p></div>
    </div>
  </section>

  <section class="panel"><h2>Join a game</h2>
    <ol class="steps big w-join">
      <li><b>Sign in</b> with the Claude account your G.M. invited. Your characters are saved to your account.</li>
      <li><b>Make a character.</b> Pick a ready-to-play starter, or browse the <button class="linkbtn" data-act="tab" data-v="classes">Classes</button> tab. New to role-playing? Read the <button class="linkbtn" data-act="tab" data-v="guide">Guide &amp; Rules</button>.</li>
      <li><b>Join the campaign.</b> In My Characters, choose your G.M.'s campaign for your character. You'll show up in the party.</li>
      <li><b>Play.</b> Roll from your sheet; every roll appears in the shared log for the whole table.</li>
    </ol>
  </section>
  <p class="small muted">Rifts® is a trademark of Palladium Books. This is an unofficial fan tool for your own game; the book has the full setting and rules.</p>
  </div>`;
}

function cloneStarter(id){
  const s=STARTERS.find(x=>x.id===id); if(!s) return;
  const c=Object.assign(blankChar(),JSON.parse(JSON.stringify(s.data)));
  for(const k of ["skills","powers","weapons","armor"]) c[k]=(c[k]||[]).map(x=>({...x,id:uid()}));
  c.combat={...blankChar().combat,...c.combat,used:0};
  c.guide={title:s.title,role:s.role,...s.guide}; c.starter=s.id;
  S.picker=false; S.tab="sheet"; addChar(c);
}

function blankFromClass(i){
  const k=CLASSES[i]; if(!k) return;
  const c=blankChar("New "+k.n);
  if(k.k==="R.C.C."){c.classType="rcc";c.race=k.n;c.occ=""}
  else if(k.k==="Race + O.C.C."){c.classType="raceocc";c.race=k.n;c.occ=k.n}
  else {c.classType="occ";c.occ=k.n}
  c.notes=`Class: ${k.n} (${k.k}). Stats start around page ${k.p} of the Rifts Ultimate Edition.\nRequirements: ${k.req}.\nFill in attributes, skills and gear from the book. The Skill Library tab fills in base percentages for you.`;
  S.picker=false;S.tab="sheet";addChar(c);
}
function howToPlay(c){
  const g=c.guide; if(!g) return "";
  return `<details class="panel howto" ${S.howtoClosed?.[S.sel]?"":"open"} id="howto"><summary><span class="role">${esc(g.role)}</span> How to play ${esc(c.name)}</summary>

const GLOSSARY=[
 ["Attacks per melee","How many actions you get in one melee round. Most trained fighters start with 4."],

 ["Parry","Blocking a hand-to-hand attack with a weapon, shield or armored arm. Free if you have Hand to Hand training."],

 ["Automatic dodge","A special ability (Juicers, some monsters) to dodge without losing an attack."],
 ["Roll with impact","Rolling with a punch, fall or blast to take half damage. Costs one attack."],
 ["Natural 20","Rolling a 20 on the die itself, before bonuses. A natural 20 strike is a critical hit (double damage)."],
 ["S.D.C.","Structural Damage Capacity. Ordinary toughness: people, cars, walls. Lost before Hit Points."],
 ["Hit Points (H.P.)","Your life. At 0 you fall into a coma and may die."],
 ["M.D. / Mega-Damage","Super-powerful damage. 1 M.D. equals 100 S.D.C. One M.D. blast can kill an unarmored human."],

 ["P.P.E.","Potential Psychic Energy: magic fuel. Mages spend it to cast spells."],

const CAN=[ // attack type → parry, dodge, roll with impact
 ["Punch, kick or hand weapon (S.D.C.)",["yes","Free with Hand to Hand training"],["yes","Costs your next attack"],["yes","Half damage; costs 1 attack"]],
 ["Vibro-Blade, Psi-Sword, monster claws (M.D.)",["warn","Only with an M.D. object: Vibro-Blade, M.D.C. armor, rifle. Bare hands fail"],["yes","Costs your next attack"],["warn","Not vs blades; yes vs blunt M.D. blows"]],
 ["Bullets and energy blasts",["no","Can't be parried"],["warn","Only if you see the shooter. −5 within 50 ft, −10 within 10 ft"],["no","No"]],
 ["Spell or psionic bolt (Fire Bolt, Mind Bolt)",["no","No"],["warn","If the spell's save is dodge; some need a set number (e.g. 18+)"],["no","No"]],

const GSECS=[["g-new","New to role-playing"],["g-house","House rules"],["g-turn","Combat step by step"],["g-strike","Strike"],["g-parry","Parry"],["g-dodge","Dodge"],["g-can","Can I defend?"],["g-more","Other moves"],["g-md","M.D. vs S.D.C."],["g-saves","Saves & Perception"],["g-defend","Defense helper"],["g-gloss","Glossary"]];
function guideView(c){
  const t=c?combatTotals(c):null;
  const chip=v=>`<span class="can ${v[0]}">${v[0]==="yes"?"Yes":v[0]==="no"?"No":"Sometimes"}</span><span class="can-note">${esc(v[1])}</span>`;
  return `<div class="guide">
  <nav class="gnav" aria-label="Guide sections">${GSECS.map(([id,l])=>`<a href="#${id}" data-act="guide" data-v="${id}">${l}</a>`).join("")}</nav>
  <div class="gbody">
  <section class="panel gsec" id="g-new"><h2>New to role-playing</h2>
    <p>A tabletop role-playing game is a story you tell together. One person, the <b>Game Master (G.M.)</b>, describes the world and plays everyone you meet. Everyone else plays one character each and says what that character does: "I sneak up to the window," "I ask the trader about the missing kids," "I shoot the Brodkil."</p>
    <p>When an action could fail, you roll dice. Rifts uses two kinds of rolls:</p>
    <ul><li><b>d20 rolls</b> for combat, saves and noticing things. Roll a twenty-sided die, add your bonuses, and try to reach a target. <b>Higher is better.</b></li>
      <li><b>Percentile (d100) rolls</b> for skills like Climbing or Barter. Roll 1-100 and get <b>equal to or under</b> your skill %. <b>Lower is better.</b></li></ul>
    <p>Nobody "wins." The goal is a good story. Talk in character, ask the G.M. questions, and work with the other players.</p>
    <h3>Your first session</h3>
    <ol class="steps"><li>Pick a starter character, or browse the <button class="linkbtn" data-act="tab" data-v="classes">Classes</button> tab and let your G.M. help you build one.</li><li>Read your "How to play" card at the top of your sheet.</li><li>Find your <b>attacks per melee</b>, your best weapon and your armor's M.D.C.</li><li>When the G.M. says "roll initiative," press Roll on Initiative. The app does the math and shows everyone the result.</li><li>When unsure, describe what you want to do. The G.M. will tell you what to roll.</li></ol>
  </section>
  <section class="panel gsec" id="g-house"><h2>House rules</h2>${houseView()}</section>
  <section class="panel gsec" id="g-turn"><h2>Combat step by step</h2>
    <p>Combat happens in <b>melee rounds</b> of 15 seconds. Each character has a number of <b>attacks per melee</b> (usually 4 or 5) and fighters trade actions back and forth until everyone has used theirs. Then a new round starts.</p>
    <ol class="steps big">
      <li><b>Roll initiative.</b> Everyone rolls a d20 once per round. Highest goes first. A sneak attack or an unseen long-range attacker gets initiative automatically.</li>
      <li><b>Attacker rolls to strike.</b> d20 plus strike bonuses. In hand to hand, 5 or more hits. Guns and blasts need 8 or more. A 1-4 always misses.</li>
      <li><b>Defender may parry, dodge or entangle.</b> The defender rolls a d20 plus bonuses and must <b>match or beat</b> the strike. Ties go to the defender.</li>
      <li><b>Roll damage</b> if the attack wasn't stopped. It comes off armor first, then S.D.C., then Hit Points. Use Take a hit on the Gear &amp; Armor tab.</li>
      <li><b>Roll with impact</b> (optional) against punches, falls and explosions to take half damage. It costs one attack.</li>
      <li><b>Switch.</b> Now the defender attacks back, and so on, until all attacks are spent.</li>
    </ol>
    <p class="callout">Out of attacks? You can still <b>parry</b> for free if you're trained. Dodging takes an attack from your <b>next</b> round, so you fall further behind.</p>
  </section>
  <section class="panel gsec" id="g-strike"><h2>Strike</h2>
    <p>Roll a d20 and add your strike bonus.${t?` <b>${esc(c.name)}'s</b> hand to hand strike is <b>${sgn(t.strike.base+t.strike.add)}</b>.`:""}</p>
    <ul class="rules">
      <li class="ok"><b>Hand to hand:</b> 5 or more hits, unless the target parries or dodges.</li>
      <li class="ok"><b>Guns and energy weapons:</b> need <b>8 or more</b>, including bonuses.</li>
      <li class="no"><b>1-4 always misses</b>, and a natural 1 misses no matter your bonuses.</li>
      <li class="ok"><b>Natural 20:</b> always hits for double damage, unless the defender also rolls a natural 20.</li>
      <li class="no"><b>P.P. and Hand to Hand bonuses don't apply to guns.</b> Only your W.P. bonus for that weapon type does.</li>
      <li class="no"><b>No W.P.?</b> You can still fire, but with no bonuses, no Aimed or Called shots, −3 on bursts, −6 shooting wild.</li>
    </ul>
    <h3>Shooting modifiers</h3>
    <div class="tbl"><table class="mods"><tbody>
      <tr><td>Aimed shot</td><td class="num pos">+2</td><td>Single shot only; uses 2 attacks</td></tr>
      <tr><td>Called shot</td><td class="num">±0</td><td>Pick a spot (gun hand, sensor); uses 2 attacks. Small targets −3 or −4</td></tr>
      <tr><td>Aimed + called</td><td class="num pos">+2</td><td>Uses 3 attacks</td></tr>
      <tr><td>Burst</td><td class="num neg">½</td><td>W.P. bonus is halved</td></tr>
      <tr><td>Shooting wild</td><td class="num neg">−6</td><td>Panicked, running, from a moving vehicle or horse</td></tr>
      <tr><td>Can't see the target</td><td class="num neg">−10</td><td></td></tr>
      <tr><td>Moving target</td><td class="num neg">−1</td><td>−1 more per 50 mph over 20, −1 more if it's zig-zagging</td></tr>
      <tr><td>Up to 30% past range</td><td class="num neg">−5</td><td></td></tr>
      <tr><td>Target fully behind cover</td><td class="num neg">✕</td><td>Can't hit; partly covered needs a called shot</td></tr>
    </tbody></table></div>
  </section>
  <section class="panel gsec" id="g-parry"><h2>Parry</h2>
    <p>A parry blocks a hand-to-hand attack. Roll d20 plus your parry bonus and match or beat the strike.${t?` <b>${esc(c.name)}'s</b> parry is <b>${sgn(t.parry.base+t.parry.add)}</b>.`:""}</p>
    <ul class="rules">
      <li class="ok"><b>Free</b> for anyone with a Hand to Hand skill: it doesn't use an attack.</li>
      <li class="no"><b>Untrained?</b> Every parry costs your next attack.</li>
      <li class="no"><b>Bullets and energy blasts can't be parried.</b> Dodge them instead.</li>
      <li class="warn"><b>M.D. weapons</b> (Vibro-Blades, Psi-Swords, monster claws) must be blocked with an M.D. object: another Vibro-Blade, an M.D.C. rifle, or an arm in M.D.C. armor. A bare hand fails and takes the damage.</li>
      <li class="warn"><b>Bare-handed vs a weapon:</b> no parry bonuses, and you must hit the attacker's arm, not the blade.</li>
      <li class="no"><b>Only what you can see.</b> Attacks from behind or sneak attacks can't be parried.</li>
      <li class="ok"><b>Several attackers:</b> you can parry up to three. A fourth gets a free hit.</li>
    </ul>
  </section>
  <section class="panel gsec" id="g-dodge"><h2>Dodge</h2>
    <p>A dodge moves you out of the way. Roll d20 plus dodge bonus and match or beat the strike.${t?` <b>${esc(c.name)}'s</b> dodge is <b>${sgn(t.dodge.base+t.dodge.add)}</b>.`:""}</p>
    <ul class="rules">
      <li class="warn"><b>Costs your next attack.</b> Dodge too often and you never get to attack.</li>
      <li class="ok"><b>Automatic dodge</b> is free, but only characters whose class says so have it (Juicers, some monsters, Cyber-Knights at level 5 vs tech).</li>
      <li class="ok"><b>Works on gunfire</b> if you know it's coming and can see the shooter.</li>
      <li class="warn"><b>Against gunfire</b> only your P.P. bonus and O.C.C. dodge bonuses count. −5 within 50 ft, −10 within 10 ft.</li>
      <li class="no"><b>Can't dodge</b> sneak attacks, attacks from behind, or the first shot from an attacker you didn't see.</li>
      <li class="warn"><b>Natural 20 strikes</b> can only be dodged with a natural 20.</li>
    </ul>
  </section>
  <section class="panel gsec" id="g-can"><h2>Can I defend against this?</h2>
    <div class="tbl"><table class="can-tbl"><thead><tr><th>Attack</th><th>Parry</th><th>Dodge</th><th>Roll with impact</th></tr></thead><tbody>
    ${CAN.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${chip(r[1])}</td><td>${chip(r[2])}</td><td>${chip(r[3])}</td></tr>`).join("")}
    </tbody></table></div>
  </section>
  <section class="panel gsec" id="g-more"><h2>Other moves</h2>
    <dl class="moves">
      <dt>Entangle</dt><dd>Trap an attacker's weapon or arm instead of parrying. Costs an attack and must beat the strike roll.</dd>
      <dt>Simultaneous attack</dt><dd>Don't defend; hit back at the same time. Neither of you can parry or dodge, so both probably take damage.</dd>
      <dt>Roll with impact</dt><dd>Against punches, kicks, blunt weapons, falls and explosions: match the strike for half damage. Doesn't work against blades, bullets, energy, fire, magic or psionics. Costs one attack.</dd>
      <dt>Pull punch</dt><dd>Hold back to knock someone out instead of killing them. Declare it, then roll 11 or more.</dd>
      <dt>Power punch</dt><dd>A haymaker for double damage. Uses two attacks.</dd>
      <dt>Reload</dt><dd>Swapping an E-Clip takes one attack.</dd>
      <dt>Horror Factor</dt><dd>When a scary creature appears, roll d20 against its H.F. Fail and you lose initiative, one attack, and can't defend against its first attack.</dd>
    </dl>
  </section>
  <section class="panel gsec" id="g-md"><h2>M.D. vs S.D.C.</h2>

function defOptions(c){

function defend(kind,bonus){
  const c=cur(); const st=+S.defStrike; if(!c||!st) return;
  const r=d(20), tot=r+bonus, win=r===20||tot>=st;
  if(kind==="dodge"&&+c.combat.used<attacksOf(c)){c.combat.used=(+c.combat.used||0)+1;touch(S.sel)}

  const lbl={parry:"Parry",dodge:"Dodge",roll:"Roll with impact"}[kind];
  logRoll({char:c.name,label:`${lbl} vs strike ${st}`,detail:`d20 [${r}] ${sgn(bonus)}${kind==="roll"?" · half damage if it succeeds":""}`,total:tot,
    flag:win?(kind==="roll"?"Half damage":kind==="parry"?"Blocked":"Dodged"):(r===1?"Natural 1 · fails":"Fails · take the hit"),cls:win?"ok":"fail"});
  renderMain();
}

function applyVehDamage(v,li,amt,type){
  amt=Math.max(0,Math.floor(+amt||0)); if(!amt) return "Enter an amount of damage first.";
  let md=type==="MD"?amt:0; const msgs=[];
  if(type==="SDC"){ if(amt<100) return `${amt} S.D.C. bounces off ${v.name}: M.D.C. machines ignore S.D.C. hits under 100.`; md=Math.floor(amt/100); msgs.push(`${amt} S.D.C. converts to ${md} M.D.`)}
  const loc=v.locs[li]||v.locs[0]; const before=+loc.cur, take=Math.min(md,Math.max(0,before)); loc.cur=before-take;
  if(loc.cur<=0){ msgs.push(`${v.name} ${loc.name} takes ${take} M.D. and is destroyed${md>take?`; the other ${md-take} M.D. is stopped`:""}`);
    msgs.push(li===0||loc===v.locs[0]?`Main body gone: ${v.name} is out of action. Further hits reach the pilot`:`That part no longer works (see the book for what it does)`) }
  else msgs.push(`${v.name} ${loc.name} −${take} M.D. (${loc.cur} left)`);
  if(+loc.max>0&&loc.cur>0&&loc.cur<=+loc.max*0.25) applyDamage.info={...applyDamage.info,low:[`${v.name} ${loc.name}`]};
  return msgs.join("; ")+".";
}
