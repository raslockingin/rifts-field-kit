function vehFire(c,vi,wi,mode){
  const v=c.vehicles[vi],w=v.weapons[wi]; const melee=String(w.range||"").toLowerCase().trim()==="melee";
  if(mode==="dmg"){try{const r=rollExpr(w.dmg);let tot=r.total,det=`${w.dmg} ${r.detail}`;const crit=S.critV&&S.critV.id===S.sel&&S.critV.vi===vi&&S.critV.wi===wi;
      if(crit){tot*=2;det+=" ×2 critical";S.critV=null}
      logRoll({char:c.name,label:`${v.name} ${w.name}: damage${crit?" (critical)":""}`,detail:det,total:tot,flag:w.type==="SDC"?"S.D.C.":"M.D.",cls:crit?"crit":"",dtype:w.type==="SDC"?"SDC":"MD"})}catch(e){showStatus(e.message)}return}
  if(+w.shotsMax>0){if(+w.shots<=0){logRoll({char:c.name,label:`${v.name} ${w.name}: empty`,detail:"Out of ammo",total:0,flag:"Reload first",cls:"fail"});return}w.shots=+w.shots-1;touch(S.sel)}
  const bonus=(+w.strike||0)+(melee?(+v.pilot?.strike||0):0);
  const nat=d20Roll(`${v.name} ${w.name}: ${melee?"strike":"shot"}`,bonus,{kind:"strike",ranged:!melee});
  S.critV=nat===20?{id:S.sel,vi,wi}:null; renderMain();
}

function gearView(c){
  const worn=c.armor.filter(a=>a.equipped&&+a.cur>0);
  const eq=worn[0];
  return `<div class="stack">
  <section class="dmgbox">
    <div class="sec-head" style="margin:0"><h2 style="color:var(--ink)">Take a hit</h2>
      <span class="small muted">The outer worn layer takes the hit. If it breaks, the rest of that hit is stopped. Unarmored: natural M.D.C. → S.D.C. → Hit Points</span></div>
    <div class="row">
      <label class="f"><span class="lab">Damage</span><input id="dmg-amt" type="number" inputmode="numeric" min="0" placeholder="0"></label>
      <label class="f"><span class="lab">Attacker's strike</span><input id="dmg-strike" type="number" inputmode="numeric" min="1" placeholder="optional" title="Used against armor with an A.R."></label>
      ${inUseVehicle(c)?`<label class="f"><span class="lab">Hits</span><select id="dmg-loc" aria-label="Where the hit lands">${inUseVehicle(c).locs.map((l,li)=>`<option value="${li}" ${String(S.dmgLoc??0)===String(li)?"selected":""}>${esc(inUseVehicle(c).name)}: ${esc(l.name)} (${esc(l.cur)})</option>`).join("")}<option value="pilot" ${S.dmgLoc==="pilot"?"selected":""}>${esc(c.name)} directly</option></select></label>`:""}
      <div class="seg" role="group" aria-label="Damage type">
        <button class="md" data-act="dtype" data-v="MD" aria-pressed="${S.dmgType==="MD"}">M.D.</button>
        <button class="sdc" data-act="dtype" data-v="SDC" aria-pressed="${S.dmgType==="SDC"}">S.D.C.</button></div>
      <button class="btn pri" data-act="apply-dmg">Apply damage</button>
      <label class="small" style="display:flex;gap:5px;align-items:center" title="For abilities like the Psi-Stalker's: Hit Points become M.D.C. in some fights"><input type="checkbox" id="f-hpMdc" data-k="hpMdc" ${c.hpMdc?"checked":""} style="width:auto"> Hit Points act as M.D.C.</label>
      <span class="small muted">${eq?`Wearing ${worn.map(a=>`${esc(a.name)} (${a.cur}${+a.ar?`, A.R. ${a.ar}`:""})`).join(" over ")}`:"No armor worn"}</span>
    </div>
    ${S.lastResult?`<div class="result">${esc(S.lastResult)}</div>`:""}
    ${lethalBox(c)}
  </section>
  <section class="panel">
    <div class="sec-head"><h2>Body Armor</h2><span class="small muted">Tick every layer you wear; the list order is outer to inner. A.R. is for partial armor like Cyber-Armor (leave 0 for full suits).</span><button class="btn sm" data-act="add-armor">+ Armor</button></div>
    ${c.armor.length?`<div class="gear-grid">${c.armor.map((a,i)=>{const pct=+a.max>0?Math.max(0,Math.min(100,+a.cur/+a.max*100)):0;
      return `<div class="gear-card ${a.equipped?"equipped":""}">
        <div class="row" style="justify-content:space-between;align-items:center"><div style="flex:1;min-width:0">${inp(`armor.${i}.name`,a.name,"text",'aria-label="Armor name"')}</div>
          <label class="small" style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-act="equip" data-i="${i}" ${a.equipped?"checked":""} style="width:auto"> Worn</label></div>
        <div class="pool md" style="background:transparent;border:0;padding:0"><div class="top"><span class="lab">M.D.C. <span class="tag md">MD</span></span><span class="val">${esc(a.cur)}<small> / ${esc(a.max)}</small></span></div>
          <div class="meter"><i style="width:${pct}%"></i></div></div>
        <div class="fields"><label class="f"><span class="lab">Current</span>${inp(`armor.${i}.cur`,a.cur,"number")}</label>
          <label class="f"><span class="lab">Max</span>${inp(`armor.${i}.max`,a.max,"number")}</label>
          <label class="f"><span class="lab">A.R.</span>${inp(`armor.${i}.ar`,a.ar||0,"number",'title="Armor Rating: strikes above this bypass the armor"')}</label></div>
        <textarea id="f-armor-${i}-notes" data-k="armor.${i}.notes" aria-label="Armor notes" placeholder="Notes: locations, mobility, environment" style="min-height:44px">${esc(a.notes)}</textarea>
        <div class="row"><button class="btn sm" data-act="repair" data-i="${i}">Full repair</button>
          <button class="btn sm ghost" data-act="mv" data-list="armor" data-i="${i}" data-d="-1" ${i===0?"disabled":""} aria-label="Move outward">↑ Outer</button>
          <button class="btn sm ghost" data-act="mv" data-list="armor" data-i="${i}" data-d="1" ${i===c.armor.length-1?"disabled":""} aria-label="Move inward">↓ Inner</button>
          <button class="btn sm ghost danger" data-act="rm" data-list="armor" data-i="${i}">Remove</button></div>
      </div>`}).join("")}</div>`:`<p class="muted small">No armor yet. Add your suit with its main body M.D.C. from the book, then tick "Worn".</p>`}
  </section>
  <section class="panel">
    <div class="sec-head"><h2>Weapons</h2><button class="btn sm" data-act="add-weapon">+ Weapon</button></div>
    ${c.weapons.length?`<div class="gear-grid">${c.weapons.map((w,i)=>`<div class="gear-card">
        <div class="row" style="align-items:center"><div style="flex:1;min-width:0">${inp(`weapons.${i}.name`,w.name,"text",'aria-label="Weapon name"')}</div><span class="tag ${w.type==="MD"?"md":"sdc"}">${w.type==="MD"?"M.D.":"S.D.C."}</span></div>
        <div class="fields">
          <label class="f"><span class="lab">Damage</span>${inp(`weapons.${i}.dmg`,w.dmg,"text",'placeholder="3d6"')}</label>
          <label class="f"><span class="lab">Type</span><select id="f-weapons-${i}-type" data-k="weapons.${i}.type"><option value="MD" ${w.type==="MD"?"selected":""}>M.D.</option><option value="SDC" ${w.type!=="MD"?"selected":""}>S.D.C.</option></select></label>
          <label class="f"><span class="lab">Range</span>${inp(`weapons.${i}.range`,w.range,"text",'placeholder="melee or 1200 ft"')}</label>
          <label class="f"><span class="lab">W.P.</span><select id="f-weapons-${i}-wp" data-k="weapons.${i}.wp" aria-label="Weapon proficiency"><option value="">None</option>${Object.keys(WP).filter(k=>(c.wps||[]).includes(k)||k===w.wp).map(k=>`<option ${w.wp===k?"selected":""}>${esc(k)}</option>`).join("")}</select></label>
          <label class="f"><span class="lab">Weapon +</span>${inp(`weapons.${i}.strike`,w.strike,"number",'title="The weapon\'s own strike bonus, plus any bonus you track by hand"')}</label>
          <label class="f"><span class="lab">Aimed +</span>${inp(`weapons.${i}.aimed`,w.aimed||0,"number",'title="Weapon\'s own aimed-shot bonus; the skilled +2 is added automatically"')}</label>
          <label class="f"><span class="lab">Shots</span>${inp(`weapons.${i}.shots`,w.shots,"number")}</label>
          <label class="f"><span class="lab">Payload</span>${inp(`weapons.${i}.shotsMax`,w.shotsMax,"number")}</label>
          <label class="f"><span class="lab">Spare E-Clips</span>${inp(`weapons.${i}.clips`,w.clips,"number")}</label>
        </div>
        ${inp(`weapons.${i}.notes`,w.notes,"text",'placeholder="Notes: bursts, rate of fire" aria-label="Weapon notes"')}
        ${(()=>{const melee=String(w.range||"").toLowerCase().trim()==="melee",t=combatTotals(c),wb=wpAt(w.wp,c.level);
          const hit=(+w.strike||0)+wb.s+(melee?t.strike.base+t.strike.add:0);
          return `<div class="small tohit">To hit <b class="num">${sgn(hit)}</b>${melee?` · parry <b class="num">${sgn(t.parry.base+t.parry.add+wb.p)}</b>`:" · needs 8+"}${wb.t?` · thrown +${wb.t}`:""}${S.critW&&S.critW.id===S.sel&&S.critW.i===i?` · <span class="flag crit">next damage ×2</span>`:""}</div>`})()}
        <div class="row"><button class="btn sm pri" data-act="w-strike" data-i="${i}">${+w.shotsMax>0?"Fire":"Strike"}</button>
          ${String(w.range||"").toLowerCase().trim()==="melee"?`<button class="btn sm" data-act="w-parry" data-i="${i}">Parry</button>`:""}
          ${String(w.range||"").toLowerCase().trim()!=="melee"?`<button class="btn sm" data-act="w-aimed" data-i="${i}" title="+2 skilled aimed shot plus the weapon's aimed bonus; uses 2 attacks">Aimed</button>`:""}
          <button class="btn sm" data-act="w-dmg" data-i="${i}">Damage</button>
          ${+w.shotsMax>0?`<button class="btn sm" data-act="reload" data-i="${i}" ${+w.clips>0?"":"disabled"}>Reload</button>`:""}
          <button class="btn sm ghost danger" data-act="rm" data-list="weapons" data-i="${i}">Remove</button></div>
      </div>`).join("")}</div>`:`<p class="muted small">No weapons yet. Add each one with its damage dice and payload from your book.</p>`}
    <p class="small muted" style="margin:8px 0 0">Set Range to "melee" for hand weapons: they add your P.P. and Hand to Hand strike bonuses and, for S.D.C. weapons, P.S. damage. Guns use only their W.P. bonus plus "Weapon +" and need 8+ to hit. A natural 20 strike doubles that weapon's next damage roll.</p>
  </section>
  ${vehiclesView(c)}
  <section class="panel">
    <div class="sec-head"><h2>Credits &amp; Inventory</h2></div>
    <div class="row" style="margin-bottom:8px"><label class="f" style="width:160px"><span class="lab">Universal credits</span>${inp("credits",c.credits,"number")}</label>
      <label class="f" style="width:160px"><span class="lab">Black market items</span>${inp("bmcredits",c.bmcredits,"number")}</label></div>
    <textarea id="f-inventory" data-k="inventory" aria-label="Inventory" placeholder="Gear, E-Clips, rations, salvage…">${esc(c.inventory)}</textarea>
  </section></div>`;
}

const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const LIB_INDEX=new Map(SKILL_LIB.map(r=>[norm(r[1]),r]));
function libFind(name){return LIB_INDEX.get(norm(name))||null}
const LIB_CATS=[...new Set(SKILL_LIB.map(r=>r[0]))];
function libraryView(c){
  const q=norm(S.libQ), cat=S.libCat||"";
  const have=new Set(c.skills.map(s=>norm(s.name)));
  const list=SKILL_LIB.map((r,i)=>[r,i]).filter(([r])=>(!cat||r[0]===cat)&&(!q||norm(r[1]+r[4]+r[5]).includes(q)));
  return `<div class="stack"><section class="panel">
    <div class="sec-head"><h2>Skill Library</h2><span class="small muted">${list.length} of ${SKILL_LIB.length} skills · descriptions and examples are summaries; your rulebook has the full rules</span></div>
    <div class="row">
      <label class="f" style="flex:2;min-width:180px"><span class="lab">Search</span><input id="lib-q" type="search" placeholder="e.g. pilot, lock, medic" value="${esc(S.libQ||"")}"></label>
      <label class="f" style="flex:1;min-width:160px"><span class="lab">Category</span><select id="lib-cat"><option value="">All categories</option>${LIB_CATS.map(k=>`<option ${k===cat?"selected":""}>${esc(k)}</option>`).join("")}</select></label>
    </div></section>
    ${list.length?`<div class="lib">${list.map(([r,i])=>{const on=have.has(norm(r[1]));
      const pct=r[2]==null?`<span class="tag sdc">No %</span>`:`<span class="lib-pct">${r[2]}% <small>+${r[3]}%/lvl</small></span>`;
      return `<article class="lib-card"><div class="lib-top"><div style="min-width:0"><h3>${esc(r[1])}</h3><span class="lab">${esc(r[0])}</span></div>${pct}</div>
        <p>${esc(r[4])}</p>
        <p class="lib-ex"><span class="lab">At the table</span> ${esc(r[5])}</p>
        ${r[6]?`<p class="small muted">This skill has two percentages (one for a harder use). The first is filled in; check your book for the second.</p>`:""}
        ${r[2]==null?`<p class="small muted">Gives combat, attribute or S.D.C. bonuses rather than a percentage. Enter them on the sheet from your book.</p>`:""}
        <button class="btn sm ${on?"":"pri"}" data-act="lib-add" data-i="${i}" ${on?"disabled":""}>${on?"On sheet":"Add to "+esc(c.name)}</button></article>`}).join("")}</div>`
      :`<div class="panel empty"><h2>No skills match</h2><p>Try a shorter search or pick "All categories".</p></div>`}
  </div>`;
}

async function renderDock(){
  const el=document.getElementById("dock");
  const ids=[...new Set(S.rolls.map(r=>r.by).filter(Boolean))];
  if(S.user&&ids.length){try{const ps=await S.user.profiles(ids);for(const id of ids)S.names[id]=ps[id]?.name||""}catch(e){}}
  const prevExpr=document.getElementById("expr")?.value||"";
  const focused=document.activeElement?.id==="expr";
  el.innerHTML=`<section class="panel"><div class="sec-head"><h2>Dice</h2><span class="small muted">${cur()?"Rolling as "+esc(cur().name):"No character selected"}</span></div>
    <div class="dice-btns">${["1d20","1d100","1d4","1d6","2d6","3d6","4d6","1d8","1d10","1d12","1d6x10","2d4x10"].map(x=>`<button class="btn" data-act="quick" data-v="${x}">${x.toUpperCase()}</button>`).join("")}</div>
    <form class="expr" id="expr-form" style="margin-top:8px"><input id="expr" placeholder="e.g. 2d6+3 or 1d6x10" aria-label="Dice expression" value="${esc(prevExpr)}"><button class="btn pri" type="submit">Roll</button></form>
  </section>
  <section class="panel"><div class="sec-head"><h2>Table log</h2><span class="small muted">${S.local?"This device only":"Shared live"}</span></div>
    <div class="log">${S.rolls.length?S.rolls.map(r=>{const isNew=!S.seen.has(r.id);S.seen.add(r.id);
      const who=r.by?(r.by===S.me?"You":(S.names[r.by]||"Someone")):"";
      return `<div class="entry ${r.cls||""} ${isNew?"new":""}"><div class="who"><span>${esc(r.char||"")}${who?" · "+esc(who):""}</span><span>${new Date(r.ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</span></div>
        <div class="what">${esc(r.label)}${r.dtype?` <span class="tag ${r.dtype==="MD"?"md":"sdc"}">${r.dtype==="MD"?"M.D.":"S.D.C."}</span>`:""}</div><div class="tot">${esc(r.total)}</div>
        <div class="det">${esc(r.detail)}${r.flag&&!r.dtype?` · <span class="flag ${r.cls||""}">${esc(r.flag)}</span>`:""}</div></div>`}).join("")
      :`<p class="muted small">Rolls from everyone at the table appear here, newest first.</p>`}</div></section>
  <p class="notice">Built for your own play from your own books. Enter O.C.C., weapon and armor stats from the rulebook; the app handles the math.</p>`;
  if(focused){const n=document.getElementById("expr");n.focus()}
}

/* ---------- events ---------- */
document.addEventListener("input",e=>{
  if(e.target.id==="lib-q"){S.libQ=e.target.value;renderMain();return}
  if(e.target.id==="def-strike"){S.defStrike=e.target.value;renderMain();return}
  if(e.target.type==="checkbox"||e.target.tagName==="SELECT") return;
  const k=e.target.dataset?.k; const c=cur(); if(!k||!c) return;
  let v=e.target.type==="number"?(e.target.value===""?0:+e.target.value):e.target.value;
  setPath(c,k,v); touch(S.sel);
  if(k==="name"||k==="level") renderRoster();
  if(e.target.tagName!=="TEXTAREA") renderMain();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="def-kind"){S.defKind=t.value;renderMain();return}
  if(t.id==="camp-pick"){if(t.value==="__new"){S.tab="campaign";S.picker=false;setCamp("");return}setCamp(t.value);return}
  if(t.classList?.contains("camp-sel")){const id=t.dataset.id,ch=S.chars[id];if(!ch||!canEdit(id))return;ch.campaign=t.value;ch.atTable=true;touch(id);render();return}
  if(t.id==="j-type"){S.jType=t.value;return}
  const c=cur(); if(!c) return;
  if(t.id==="lib-cat"){S.libCat=t.value;renderMain();return}
  if(S.ro){showStatus(`${c.name} belongs to ${ownerName(S.sel)}. Only they or the G.M. can change it.`);renderMain();return}
  if(t.id==="h2h-pick"){setH2H(c,t.value);return}
  if(t.id==="wp-add"){if(t.value){c.wps=[...(c.wps||[]),t.value];touch(S.sel)}renderMain();return}
  if(t.id==="lvl-isp"||t.id==="lvl-ppe"){c.lvlDice={...(c.lvlDice||{}),[t.id.slice(4)]:t.value.trim()};touch(S.sel);return}
  if(t.dataset.act==="equip"){c.armor[+t.dataset.i].equipped=t.checked;touch(S.sel);renderMain()}
  else if(t.type==="checkbox"&&t.dataset.k){setPath(c,t.dataset.k,t.checked);touch(S.sel);renderMain()}
  else if(t.tagName==="SELECT"&&t.dataset.k){setPath(c,t.dataset.k,t.value);touch(S.sel);renderMain()}
});
document.addEventListener("toggle",e=>{
  if(e.target.id==="howto"){S.howtoClosed=S.howtoClosed||{};S.howtoClosed[S.sel]=!e.target.open}
},true);
document.addEventListener("submit",e=>{
  if(e.target.id!=="expr-form") return; e.preventDefault();
  const v=document.getElementById("expr").value;
  try{const r=rollExpr(v);logRoll({char:cur()?.name||"",label:v.toUpperCase(),detail:r.detail,total:r.total,flag:"",cls:""});showStatus("")}
  catch(err){showStatus(err.message)}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.type==="checkbox") return;
  const a=b.dataset.act, c=cur(), i=+b.dataset.i;
  if(S.ro&&RO_ACTS.has(a)){showStatus(`${c?.name||"This character"} belongs to ${ownerName(S.sel)}. Only they or the G.M. can change it.`);return}
  if(/^(rule-|cb-|npc-|j-(save|edit|del|done|cancel)|camp-save|secret-)/.test(a)&&!isGM()){showStatus("Only this campaign's G.M. can do that.");return}
  switch(a){
    case"sel":S.sel=b.dataset.id;S.picked=true;S.confirmDel=null;S.lastResult="";S.picker=false;if(S.tab==="mine")S.tab="sheet";remember();render();break;
    case"open-char":S.sel=b.dataset.id;S.picked=true;S.picker=false;S.tab="sheet";S.confirmDel=null;remember();render();break;
    case"at-table":{const id=b.dataset.id,ch=S.chars[id];if(!ch)break;if(!canEdit(id)){showStatus("Only the owner or the G.M. can change that.");break}
      ch.atTable=ch.atTable===false;touch(id);render();break}
    case"claim":claimChar(b.dataset.id);break;
    case"claim-all":(async()=>{for(const id of Object.keys(S.chars).filter(id=>isLegacy(id)&&(S.isAdmin||!S.chars[id].owner||S.chars[id].owner===S.me)))await claimChar(id)})();break;
    case"del-ask-id":S.confirmDel=b.dataset.id;renderMain();break;
    case"del-id":S.confirmDel=null;delChar(b.dataset.id);break;
    case"tab":S.tab=b.dataset.v;S.picker=false;remember();renderMain();break;
    case"mview":S.mview=b.dataset.v;renderRoster();break;
    case"new-char":S.picker=false;S.tab="sheet";addChar(blankChar());break;
    case"picker":S.picker=true;S.mview="sheet";renderRoster();renderMain();window.scrollTo({top:0});break;
    case"picker-close":S.picker=false;renderMain();break;
    case"clone":cloneStarter(b.dataset.v);break;
    case"skin":applySkin(b.dataset.v);break;
    case"w-hide":try{localStorage.setItem("rft.seenWelcome","1")}catch(e){}S.tab=cur()?"sheet":"mine";S.picker=!cur()&&!S.me;remember();renderMain();break;
    case"class-blank":blankFromClass(i);break;
    case"cls-group":S.clsGroup=b.dataset.v;renderMain();break;
    case"cls-easy":S.clsEasy=!S.clsEasy;renderMain();break;
    case"guide":{e.preventDefault();S.picker=false;S.tab="guide";S.mview="sheet";remember();renderRoster();renderMain();
      const id=b.dataset.v;requestAnimationFrame(()=>{const n=document.getElementById(id);if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})});break}
    case"defend":defend(b.dataset.v,+b.dataset.b);break;
    case"example":addChar(exampleChar());break;
    case"d20":{const t=combatTotals(c)[b.dataset.k];const lab={init:"Initiative",strike:"Strike",parry:"Parry",dodge:"Dodge",roll:"Roll with impact",pull:"Pull punch",disarm:"Disarm",perception:"Perception"}[b.dataset.k];
      const kind=b.dataset.k==="strike"?"strike":(b.dataset.k==="parry"||b.dataset.k==="dodge")?"defend":b.dataset.k==="pull"?"":"";
      if(b.dataset.k==="pull") d20Roll(lab,t.base+t.add,{target:11}); else d20Roll(lab,t.base+t.add,{kind});
      if(["strike","parry","dodge","disarm"].includes(b.dataset.k)&&+c.combat.used<attacksOf(c)&&b.dataset.k!=="parry"){c.combat.used=+c.combat.used+1;touch(S.sel);renderMain()}
      break}
    case"save":{const s=SAVES.find(x=>x[0]===b.dataset.k);const sb=saveBonus(c,s[0],s[3]);d20Roll(`Save vs ${s[1]}`,sb.total,s[2]?{target:s[2]}:{});break}
    case"skill":skillRoll(c.skills[i]);break;
    case"pip":c.combat.used=(+c.combat.used===i+1)?i:i+1;touch(S.sel);renderMain();break;
    case"new-melee":c.combat.used=0;touch(S.sel);renderMain();break;
    case"lib-add":{const r=SKILL_LIB[i];if(!c.skills.some(s=>norm(s.name)===norm(r[1]))){c.skills.push({id:uid(),name:r[1],base:r[2]??0,per:r[3]??0,bonus:0,src:"O.C.C."});touch(S.sel);renderMain()}break}
    case"add-skill":c.skills.push({id:uid(),name:"",base:30,per:5,bonus:0});touch(S.sel);renderMain();break;
    case"add-armor":c.armor.push({id:uid(),name:"New armor",cur:0,max:0,equipped:!c.armor.some(x=>x.equipped),notes:""});touch(S.sel);renderMain();break;
    case"add-weapon":c.weapons.push({id:uid(),name:"New weapon",dmg:"1d6",type:"MD",range:"",shots:0,shotsMax:0,clips:0,strike:0,notes:""});touch(S.sel);renderMain();break;
    case"rm":c[b.dataset.list].splice(i,1);touch(S.sel);renderMain();break;
    case"repair":c.armor[i].cur=c.armor[i].max;touch(S.sel);renderMain();break;
    case"reload":{const w=c.weapons[i];if(+w.clips>0){w.clips=+w.clips-1;w.shots=w.shotsMax;touch(S.sel);renderMain()}break}
    case"w-strike":weaponFire(c.weapons[i],"strike");break;
    case"w-dmg":weaponFire(c.weapons[i],"dmg");break;
    case"w-aimed":weaponFire(c.weapons[i],"aimed");break;

const FIREBASE_CONFIG={ // public site (raslockingin.github.io): Firebase project rifts-e51e9
  apiKey:"AIzaSyD799-RNXWs8j8OIV7Ub2COIXAPbPKaSko",authDomain:"rifts-e51e9.firebaseapp.com",projectId:"rifts-e51e9",
  storageBucket:"rifts-e51e9.firebasestorage.app",messagingSenderId:"680435836788",appId:"1:680435836788:web:f7255d7e85920421fe6e21"};
const OWNER_EMAILS=["raslockingin@gmail.com"]; // site admins (act as G.M. everywhere, can change table-wide settings)
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function connectBackend(){
  if(window.claude?.use){
    const db=await window.claude.use("db").catch(()=>null);
    const user=await window.claude.use("user").catch(()=>null);
    return {db,user};
  }
  if(!FIREBASE_CONFIG) return {db:null,user:null,why:"noconfig"};
  try{
    const SRC=["https://www.gstatic.com/firebasejs/10.12.2/","https://cdn.jsdelivr.net/npm/firebase@10.12.2/"];
    const get=async f=>{for(const v of SRC){try{await loadScript(v+f);return}catch(e){}}throw new Error("load "+f)};
    await get("firebase-app-compat.js");
    await Promise.all([get("firebase-auth-compat.js"),get("firebase-firestore-compat.js")]);
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  }catch(e){return {db:null,user:null,why:"load"}}
  const auth=firebase.auth(), fs=firebase.firestore();
  const u=await new Promise(r=>{const off=auth.onAuthStateChanged(x=>{off();r(x)})});
  if(!u) return {db:null,user:null,why:"signin"};
  const prof={name:u.displayName||(u.email||"Player").split("@")[0],avatarUrl:u.photoURL||""};
  fs.doc("profiles/"+u.uid).set(prof).catch(()=>{});
  const admin=OWNER_EMAILS.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase());
  const user={id:async()=>u.uid,me:async()=>prof,canEdit:async()=>admin,
    profiles:async ids=>{const out={};await Promise.all(ids.map(async id=>{try{const g=await fs.doc("profiles/"+id).get();if(g.exists)out[id]=g.data()}catch(e){}}));return out}};
  S.web=true;
  return {db:fs,user};
}
function webSignIn(){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(()=>location.reload()).catch(e=>{if(e?.code==="auth/popup-blocked"||e?.code==="auth/operation-not-supported-in-this-environment")firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider());else showStatus("Sign-in didn't finish: "+(e?.message||e))})}
function webSignOut(){firebase.auth().signOut().then(()=>location.reload())}
function showSignIn(why){const el=document.getElementById("status");if(!el)return;el.hidden=false;
  el.innerHTML=why==="signin"
   ?`<b>Sign in to save your characters and join campaigns.</b> Until then everything stays on this screen only. <button class="btn pri sm" id="w-signin" style="margin-left:8px">Sign in with Google</button>`
   :why==="load"?"Couldn't reach the save server. Check your connection and reload."
   :"Preview mode: saving isn't set up on this copy yet, so characters stay on this screen only.";
  document.getElementById("w-signin")?.addEventListener("click",webSignIn)}

/* ---------- boot ---------- */
function applySkin(v){v=["night","day","auto"].includes(v)?v:"night";document.documentElement.setAttribute("data-skin",v);
  document.querySelectorAll(".skin button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));try{localStorage.setItem("rft.skin",v)}catch(e){}}
(()=>{let v="night";try{v=localStorage.getItem("rft.skin")||"night"}catch(e){}applySkin(v)})();
render();
(async()=>{
  const {db,user,why}=await connectBackend();
  if(why){showSignIn(why);return}
  S.user=user; if(user){try{S.me=await user.id();S.meProfile=await user.me();S.isAdmin=await user.canEdit()}catch(e){}}
  if(!db){showStatus("Shared storage isn't available in this view, so characters and rolls stay on this device for now.");return}
  S.db=db; S.local=false;
  // older shared characters (made before accounts)
  db.collection("characters").onSnapshot(snap=>setSource("legacy",snap.docs.map(d=>[d.id,"characters/"+d.id,structuredClone(d.data())])),
    err=>showStatus(err?.code==="revoked"?"":"Lost the live connection to the table. Reload to reconnect."));
  // every player's own characters
  const watchPlayer=pid=>{ if(S.playerSubs[pid]) return;
    S.playerSubs[pid]=db.collection(`players/${pid}/chars`).onSnapshot(s=>setSource("p:"+pid,s.docs.map(d=>[d.id,`players/${pid}/chars/${d.id}`,structuredClone(d.data())])),()=>{}) };
  if(S.me) watchPlayer(S.me);
  db.collection("players").onSnapshot(snap=>{for(const d of snap.docs) watchPlayer(d.id)},()=>{});
  if(S.me){ try{const ref=db.doc("players/"+S.me);const g=await ref.get();if(!g.exists) await ref.set({joined:Date.now()})}catch(e){} }
  render();
  // campaigns: every G.M.'s campaigns
  const watchGM=gid=>{ if(S.gmSubs[gid]) return;
    S.gmSubs[gid]=db.collection(`gms/${gid}/camps`).onSnapshot(s=>{
      for(const k of Object.keys(S.camps)) if(k.startsWith(gid+":")) delete S.camps[k];
      for(const d of s.docs) S.camps[campKey(gid,d.id)]={...structuredClone(d.data()),cid:d.id,gm:gid};
      const ids=[...new Set(Object.values(S.camps).map(c=>c.gm))].filter(x=>!(x in S.names));
      if(ids.length&&S.user) S.user.profiles(ids).then(ps=>{for(const id of ids)S.names[id]=ps[id]?.name||"";render()}).catch(()=>{});
      if(S.camp&&S.camps[S.camp]&&!S.campReady){S.campReady=true;subCampaign()} else render();
    },()=>{}) };
  if(S.me) watchGM(S.me);
  db.collection("gms").onSnapshot(snap=>{for(const d of snap.docs) watchGM(d.id)},()=>{});
  if(S.me) db.doc(`gms/${S.me}/lib/bestiary`).onSnapshot(s=>{S.bestiary=s.exists?structuredClone(s.data().list||[]):[];renderMainSoft()},()=>{});
  subCampaign();
})();
